<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện Nói – Ôn thi VSTEP B1–C1</title>
<meta name="description" content="Luyện Nói VSTEP B1–C1: đề nói đủ 3 phần có ghi âm, bấm giờ, bài nói mẫu để so sánh và từ vựng mới có phát âm giọng nam, giọng nữ.">
<script>
/* ================================================================
   CÀI ĐẶT — chỉ cần sửa phần này (giữ nguyên dấu ngoặc kép "")
   Phần này giống nhau ở cả 5 trang: sửa ở trang nào thì sửa luôn 4 trang còn lại.
   ================================================================ */
window.VSTEP_CONFIG = {
  brand: "Ôn thi VSTEP",          // tên hiện ở góc trái thanh menu
  levelName: "Bậc 3–5",           // các bậc khoá học luyện
  level: "B1–C1",
  defaultTarget: "b1",            // bậc mục tiêu khi học viên chưa tự chọn: "b1", "b2" hoặc "c1"
  studentName: "",                // tên học viên (tuỳ chọn) — để "" thì web dùng chung cho mọi người
  examDate: "",                   // ngày thi chung, dạng "2026-12-12" — để "" thì học viên tự chọn
  sheetUrl: "",                   // link Ứng dụng web Google Sheet (…/exec) của RIÊNG trang này để nhận kết quả — để "" thì kết quả chỉ lưu trên máy học viên
  teacherName: "thầy Hoàng",      // tên người chữa bài, ví dụ "cô Lan" — để "" sẽ hiện là "giáo viên"
  teacherEmail: "",               // email nhận bài Viết/Nói của học viên (để "" nếu không dùng)

  // CÁC FILE CỦA TRANG — đặt chung một thư mục, giữ nguyên tên
  linkMode: "file",
  files: { home: "index.html", nghe: "nghe.html", noi: "noi.html", doc: "doc.html", viet: "viet.html" },
  audioBase: "audio/"             // thư mục chứa file nghe và file phát âm, đặt cạnh các file .html
};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== GIAO DIỆN DÙNG CHUNG (giống nhau ở mọi trang) ===== */
:root{
  --bg:#f4f5f9; --grid:#e6e9f0; --card:#fff; --ink:#1b2130; --muted:#5d6577; --line:#dfe3ea;
  --blue-50:#e6f0ff; --blue-100:#d6e6ff; --blue-200:#b7cff5; --blue-400:#6f9fe6; --blue-600:#2563eb; --blue-700:#1d4ed8; --blue-900:#123a7a;
  --red:#c62828; --ok:#15803d; --ok-soft:#e8f6ec; --bad:#b42318; --bad-soft:#fdecea; --warn:#8a4f06; --warn-soft:#fff5e0;
  --font:"Be Vietnam Pro","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-700)}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--blue-600);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
.muted{color:var(--muted)}
.small{font-size:.9rem}

/* thanh menu */
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.nav-in{max-width:1040px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.12rem;color:var(--ink);text-decoration:none;white-space:nowrap;padding:6px 0;background:none;border:0;cursor:pointer}
.brand .lvl{color:var(--red);font-weight:400;margin-left:7px}
.nav-links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.nav-links::-webkit-scrollbar{display:none}
.nav-a{white-space:nowrap;padding:8px 14px;border-radius:999px;font-weight:600;font-size:.98rem;color:var(--ink);text-decoration:none;border:1px solid transparent;background:none;cursor:pointer;line-height:1.3}
.nav-a:hover{background:var(--blue-50);border-color:var(--blue-200)}
.nav-a.on{background:var(--ink);color:#fff}
.nav-who{font-size:.9rem;color:var(--muted);white-space:nowrap;max-width:230px;min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.nav-who b{color:var(--ink);font-weight:600}
@media(max-width:700px){
  .nav-in{padding:6px 14px}
  .nav-links{order:3;width:100%;margin-left:-6px}
  .nav-who{display:none}
  .brand{padding:4px 0}
  .nav-a{padding:7px 12px}
}

/* nút */
.btn{appearance:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;line-height:1.25;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#aeb7c7}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.btn.blue{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
.btn.blue:hover{background:var(--blue-700);border-color:var(--blue-700)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.9rem;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:0 0 auto}

/* khối nội dung */
.sec{padding:34px 0 0}
.sec > h2{font-size:1.45rem;font-weight:800;letter-spacing:-.01em;line-height:1.25;margin-bottom:6px}
.sec > .sub{color:var(--muted);margin-bottom:14px;max-width:68ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.notice{border-radius:12px;padding:10px 14px;background:var(--blue-50);color:var(--blue-900);font-size:.95rem}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.ok{background:var(--ok-soft);color:#14532d}
.notice.bad{background:var(--bad-soft);color:#7f1d1d}
.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;background:#eceef4;font-weight:600;font-size:.85rem;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.blue{background:var(--blue-50);color:var(--blue-900)}
.field{border:1px solid #b9c1cf;border-radius:10px;padding:9px 12px;min-height:44px;background:#fff;min-width:0}
.field:focus{outline:3px solid var(--blue-200);outline-offset:0;border-color:var(--blue-600)}

/* bảng */
.tblwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
.tbl{width:100%;border-collapse:collapse;font-size:.98rem}
.tbl th,.tbl td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:.88rem;color:var(--muted);font-weight:600;background:#fafbfd;white-space:nowrap}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.hl td{background:var(--blue-50)}
.tbl td.nw{white-space:nowrap}
/* màn hình hẹp: mỗi dòng của bảng thành một khối xếp dọc */
@media(max-width:700px){
  .tbl.stack thead{display:none}
  .tbl.stack,.tbl.stack tbody{display:block}
  .tbl.stack tr{display:block;padding:12px 16px;border-bottom:1px solid var(--line)}
  .tbl.stack tr:last-child{border-bottom:0}
  .tbl.stack td{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:3px 0;border:0;text-align:right;white-space:normal}
  .tbl.stack td::before{content:attr(data-label);color:var(--muted);font-size:.88rem;text-align:left;flex:0 0 auto}
  .tbl.stack td:first-child{font-size:1.05rem;padding-bottom:5px}
  .tbl.stack td:first-child::before,.tbl.stack td.long::before{content:none}
  .tbl.stack td.long{display:block;text-align:left;padding-top:6px}
}

/* tiêu đề trang con + thẻ chuyển phần */
.pagehead{padding:30px 0 6px}
.pagehead h1{font-size:clamp(2rem,5vw,2.6rem);font-weight:800;letter-spacing:-.02em;line-height:1.15}
.pagehead h1 .lvl{color:var(--red);font-weight:400;font-size:.62em;margin-left:12px;letter-spacing:0}
.pagehead p{color:var(--muted);font-size:1.05rem;margin-top:8px;max-width:64ch}
.tabs{display:flex;gap:6px;margin:18px 0 16px;border-bottom:1px solid var(--line)}
.tab{padding:10px 18px;border:1px solid transparent;border-bottom:0;border-radius:12px 12px 0 0;font-weight:700;color:var(--muted);text-decoration:none;background:none;cursor:pointer;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{background:#fff;border-color:var(--line);color:var(--ink)}
.empty{background:#fff;border:1px dashed #b9c1cf;border-radius:14px;padding:28px 22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:4px}

/* ô nhập họ tên học viên */
.learner{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.learner .lb-label{font-weight:700;width:100%}
.learner .lb-row{display:flex;gap:8px;width:100%}
.learner .lb-row .field{flex:1 1 auto}
.learner .btn{white-space:nowrap}
.learner .lb-name{display:flex;flex-direction:column;line-height:1.35}
.learner .lb-name b{font-size:1.15rem}
.learner p{width:100%}
.ipa{color:var(--blue-900);font-family:"Segoe UI","Lucida Sans Unicode","Arial Unicode MS",sans-serif}

/* nhóm nút chọn một trong vài mục */
.pick{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:.95rem;font-weight:600}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{appearance:none;border:0;border-left:1.5px solid var(--ink);background:#fff;padding:6px 16px;font-weight:700;cursor:pointer;min-height:38px;min-width:54px}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--blue-50)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button:focus-visible{outline-offset:-3px}

/* thẻ từ vựng có nút nghe phát âm */
.words{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.word{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.word .w{font-size:1.3rem;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.word .pos{font-size:.82rem;color:var(--muted);font-weight:400;margin-left:6px}
.word .ipa{color:var(--blue-900);font-family:"Segoe UI","Lucida Sans Unicode","Arial Unicode MS",sans-serif;font-size:.98rem}
.word .vi{font-weight:600;margin-top:4px}
.word .ex{color:var(--muted);font-size:.92rem;line-height:1.5;margin-top:2px}
.word .say{margin-top:auto;padding-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.word .say .btn{white-space:nowrap;padding:6px 10px}
.btn.playing{background:var(--blue-50);border-color:var(--blue-400)}

/* chuyển trang trước / sau */
.pager{display:flex;justify-content:space-between;gap:12px;margin:36px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.pager a,.pager button{display:flex;flex-direction:column;gap:0;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:140px;cursor:pointer;text-align:left}
.pager a:hover,.pager button:hover{border-color:var(--blue-400);background:var(--blue-50)}
.pager .dir{font-size:.82rem;color:var(--muted)}
.pager .nm{font-weight:700}
.pager .next{text-align:right;margin-left:auto}

.foot{margin-top:44px;padding:18px 0 34px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:92vw;font-size:.95rem}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
@media print{.nav,.pager,.btn{display:none!important}body{background:#fff}}
.audiowarn{margin-top:16px;padding:14px 18px}
.audiowarn ul{margin:6px 0 6px;padding-left:20px}
.audiowarn li{margin-top:4px}
/* ===== LUYỆN TẬP: danh sách bài, làm bài, chấm, chữa (dùng chung cho Nghe và Đọc) ===== */
.test{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px 8px;margin-bottom:18px}
.test h2{font-size:1.35rem;font-weight:800;margin-bottom:4px}
.parts{list-style:none;margin:0;padding:0}
.parts li{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px 18px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.parts li:first-child{border-top:0}
.parts .pt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.parts .pt b{font-size:1.08rem}
.parts .pd{color:var(--muted);font-size:.95rem}
.parts .last{display:block;color:var(--blue-900);font-weight:600;margin-top:2px}
.parts .btn{min-width:128px}
@media(max-width:700px){.parts li{grid-template-columns:1fr}.parts .btn{width:100%}}

.dobar{position:sticky;top:calc(var(--navh, 57px) + 8px);z-index:10;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;margin-bottom:16px}
.dobar .count{margin-left:12px;font-size:.92rem;opacity:.85;font-variant-numeric:tabular-nums}
.dobar .btn.primary{background:#fff;color:var(--ink);border-color:#fff}
.dobar .btn.small{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.parthead{font-size:1.3rem;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px 18px;margin-bottom:14px}
.item h3{font-size:1.02rem;font-weight:700;margin-bottom:10px}
.player audio{width:100%;max-width:560px;display:block;height:44px}
.player .notice{margin-top:8px}
.q{border:0;margin:16px 0 0;padding:0;min-width:0}
.q legend,.q .qt{font-weight:600;padding:0;margin-bottom:8px;line-height:1.45}
.q .qn{color:var(--blue-900);font-weight:800}
.opt{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-top:6px;cursor:pointer;line-height:1.4}
label.opt:hover{border-color:var(--blue-400);background:var(--blue-50)}
.opt input{width:19px;height:19px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--blue-600)}
.opt:has(input:checked){border-color:var(--blue-600);background:var(--blue-50)}
.opt .lt{font-weight:800;min-width:1.1em}
.q.rev .opt{cursor:default}
.q.rev .qt .pill{margin-left:8px;vertical-align:1px}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .tag{margin-left:auto;font-size:.82rem;font-weight:700;white-space:nowrap;padding-left:10px}
.opt.right .tag{color:var(--ok)}
.opt.wrong .tag{color:var(--bad)}
.why{margin-top:8px;padding:10px 14px;border-left:3px solid var(--blue-400);background:#f7f9fd;border-radius:0 10px 10px 0;font-size:.95rem}
.why .ev{font-style:italic;color:var(--blue-900);margin-bottom:4px}
.script{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.script summary{cursor:pointer;font-weight:700;color:var(--blue-700)}
.script p{margin-top:8px;max-width:72ch}

.score{display:flex;flex-wrap:wrap;gap:8px 26px;align-items:center;background:#fff;border:1.5px solid var(--ink);border-radius:16px;padding:18px 22px}
.score .big{font-size:2.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.score .big span{font-size:1rem;font-weight:600;letter-spacing:0;color:var(--muted)}
.score > div:last-child{flex:1 1 300px}
.score p{margin-top:2px;max-width:66ch}

.vbar{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.vbar .seg button{padding:6px 12px;font-size:.92rem}
.quiz{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;max-width:640px}
.quiz .qhead{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px}
.quiz > p{margin-bottom:12px}
.qopts{display:grid;gap:8px;margin-top:16px}
.qopts .btn{justify-content:flex-start;text-align:left}
.qopts .btn.right{border-color:var(--ok);background:var(--ok-soft);opacity:1}
.qopts .btn.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:1}
.qfb{margin-top:14px}
.qfb p{margin-bottom:10px}
.qfb .qw{font-weight:800}
.qword{font-size:1.9rem;font-weight:800;letter-spacing:-.01em;margin:2px 0 12px}
/* đang làm bài: thanh menu không dính nữa để dành chỗ cho bài */
body.doing{--navh:0px}
body.doing .nav{position:static}
@media(max-width:700px){
  .dobar{padding:8px 12px;flex-wrap:nowrap}
  .dobar b,.dobar .count .long{display:none}
  .dobar .count{margin-left:0}
  .dobar .btn{min-height:38px;padding:6px 12px}
}
@media(max-width:700px){
  .dobar > div{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;white-space:nowrap}
  .dobar .clock{margin-left:0}
}
@media(max-width:700px){
  .dobar{gap:6px}
  .dobar .row{gap:6px;flex-wrap:nowrap}
  .dobar .btn{padding:6px 10px}
}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{appearance:none;border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:6px 16px;font-weight:700;cursor:pointer;min-height:38px}
.chips button:hover{background:var(--blue-50)}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff}
.chips button .done{font-weight:400;font-size:.85rem;margin-left:6px;opacity:.8}
.testpick{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:14px;font-weight:600}
/* ===== TRANG NÓI: lượt nói có ghi âm, sơ đồ chủ đề, bài nói mẫu, tự chấm ===== */
.sq{padding:14px 0 6px;border-top:1px solid var(--line)}
.item h3 + .sq{border-top:0;padding-top:2px}
.sq .qt{font-weight:600;line-height:1.45;margin-bottom:10px}
.sq .qn{color:var(--blue-900);font-weight:800}
.qx.veil{filter:blur(7px);cursor:pointer;user-select:none}
.acts{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.speak{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;min-height:44px;flex:1 1 280px;min-width:0}
.item > .speak{margin-top:12px}
.speak audio,.mine audio{height:40px;flex:1 1 220px;min-width:0;max-width:420px}
.speak .clock,.prep .clock{font-variant-numeric:tabular-nums;font-weight:800}
.speak .lim{color:var(--muted);font-size:.9rem;white-space:nowrap}
.btn.rec{border-color:var(--bad);color:var(--bad)}
.btn.rec:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn.stop{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.stop:hover{border-color:var(--bad)}
.speak .dot,.btn .dot{width:11px;height:11px;border-radius:50%;background:var(--bad);display:inline-block;flex:0 0 auto}
.btn .sqr{width:11px;height:11px;border-radius:2px;background:#fff;display:inline-block;flex:0 0 auto}
.speak.live > .dot{animation:noi-pulse 1.1s ease-in-out infinite}
@keyframes noi-pulse{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.speak.live > .dot{animation:none}}
.recbar{flex:1 1 120px;height:8px;border-radius:99px;background:#eceef4;overflow:hidden;min-width:80px;max-width:320px}
.recbar i{display:block;height:100%;width:0;background:var(--bad)}
.prep{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:600}
.btn.small svg{width:16px;height:16px}

.sit{font-size:1.05rem;max-width:70ch}
.opts3{margin:10px 0 14px;padding:0;list-style:none;display:grid;gap:6px;counter-reset:o;max-width:560px}
.opts3 li{counter-increment:o;border:1.5px solid var(--ink);border-radius:10px;padding:8px 14px;background:#fff;font-weight:600;display:flex;gap:10px}
.opts3 li::before{content:counter(o) ".";font-weight:800;color:var(--blue-900)}

.mind{margin:6px 0 16px}
.mm-topic{border:2px solid var(--ink);border-radius:14px;padding:12px 18px;font-weight:800;font-size:1.1rem;line-height:1.35;text-align:center;max-width:520px;margin:0 auto;background:var(--blue-50)}
.mm-ideas{list-style:none;margin:0;padding:26px 0 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;position:relative}
.mm-ideas::before{content:"";position:absolute;left:calc(12.5% - 3px);right:calc(12.5% - 5px);top:10.5px;border-top:2px solid var(--ink)}
.mm-ideas::after{content:"";position:absolute;left:50%;top:0;height:10.5px;border-left:2px solid var(--ink)}
.mm-ideas li{position:relative;border:1.5px solid var(--ink);border-radius:12px;padding:10px 10px;text-align:center;background:#fff;font-weight:600;line-height:1.35;display:flex;align-items:center;justify-content:center}
.mm-ideas li::before{content:"";position:absolute;left:50%;top:-15.5px;height:15.5px;border-left:2px solid var(--ink)}
.mm-ideas li.own{border-style:dashed;color:var(--muted);font-weight:400;font-style:italic}
@media(max-width:700px){
  .mm-ideas{grid-template-columns:repeat(2,minmax(0,1fr));padding-top:12px}
  .mm-ideas::before,.mm-ideas::after,.mm-ideas li::before{display:none}
}

.hint{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.hint summary{cursor:pointer;font-weight:700;color:var(--blue-700)}
.hint ul{margin:8px 0 0;padding-left:20px;max-width:72ch}
.hint .frame{margin-top:8px;padding:8px 12px;border-radius:10px;background:#f7f9fd;color:var(--blue-900);font-style:italic}

.mine{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.mine .lab{font-weight:700;white-space:nowrap}
.model{margin-top:12px;border:1px solid var(--line);border-left:3px solid var(--blue-400);border-radius:0 12px 12px 0;padding:12px 16px 14px;background:#f7f9fd}
.model .mh{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.model .mh b{margin-right:auto}
.model .seg button{padding:5px 12px;font-size:.9rem;min-height:36px}
.model .mtext p{margin-top:8px;max-width:72ch}
mark.hl{background:#ffec99;color:inherit;padding:0 2px;border-radius:3px}
.phr{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.phr li{background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:.9rem;line-height:1.45}
.rq{font-weight:600;line-height:1.45}

.assess{background:#fff;border:1.5px solid var(--ink);border-radius:16px;padding:18px 20px 20px;margin-top:26px}
.assess h2{font-size:1.3rem;font-weight:800;margin-bottom:4px}
.assess .q legend{font-weight:800}
.assess .opt .lv{font-weight:800;min-width:4.3em;color:var(--blue-900)}
.assess .send{display:flex;gap:10px;align-items:flex-start;margin-top:16px;line-height:1.45}
.assess .send input{width:19px;height:19px;margin-top:2px;flex:0 0 auto;accent-color:var(--blue-600)}
.fb{list-style:none;margin:0;padding:0}
.fb li{padding:10px 0;border-top:1px solid var(--line)}
.fb li:first-child{border-top:0}
.fb .when{color:var(--muted);font-size:.9rem;margin-right:8px}
.steps{margin:0 0 16px;padding-left:22px;max-width:74ch}
.steps li{margin-top:2px}
@media(max-width:700px){
  .dobar .btn .long{display:none}
  .speak{flex-basis:100%}
  .assess{padding:14px 14px 16px}
  .assess .opt{flex-wrap:wrap}
  .assess .opt .lv{min-width:0}
}
</style>
</head>
<body>
<noscript><p style="padding:20px">Trang này cần bật JavaScript để hoạt động.</p></noscript>
<script>window.VSTEP_PAGE = "noi";</script>
<script>
/* ===== LÕI DÙNG CHUNG (giống nhau ở mọi trang, không cần sửa) ===== */
(function () {
  'use strict';
  var C = window.VSTEP_CONFIG || {};
  var PAGE = window.VSTEP_PAGE || 'home';
  var PAGES = [
    { key: 'home', t: 'Trang chủ', en: 'Home' },
    { key: 'nghe', t: 'Nghe', en: 'Listening' },
    { key: 'noi', t: 'Nói', en: 'Speaking' },
    { key: 'doc', t: 'Đọc', en: 'Reading' },
    { key: 'viet', t: 'Viết', en: 'Writing' }
  ];
  var ICON = {
    nghe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4.5" height="6.5" rx="1.6"/><rect x="16.5" y="14" width="4.5" height="6.5" rx="1.6"/></svg>',
    noi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H10l-5 4v-4H4z"/><path d="M8.5 9h7M8.5 12h4.5"/></svg>',
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10 5 7 4.5 3.5 4.5v13c3.5 0 6.5.5 8.5 2 2-1.5 5-2 8.5-2v-13C17 4.5 14 5 12 6.500z"/><path d="M12 6.500v13"/></svg>',
    viet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.2-4.500L16.5 4.200l3.3 3.300L8.5 18.800z"/><path d="M14 6.700l3.3 3.3"/></svg>',
    loa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.500v5h3.500l5 4v-13l-5 4z"/><path d="M16 9a4.2 4.2 0 0 1 0 6"/><path d="M18.5 6.500a8 8 0 0 1 0 11"/></svg>'
  };

  /* ---------- DOM ---------- */
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) {
      for (var k in attrs) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'html') el.innerHTML = v;
        else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else if (k === 'style' && typeof v === 'object') { for (var s in v) el.style[s] = v[s]; }
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, kid) {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(function (k) { add(el, k); }); return; }
    if (typeof kid === 'string' || typeof kid === 'number') el.appendChild(document.createTextNode(String(kid)));
    else el.appendChild(kid);
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
  var toastEl = null;
  function toast(msg) {
    if (toastEl) toastEl.remove();
    toastEl = h('div', { class: 'toast', role: 'status' }, msg);
    document.body.appendChild(toastEl);
    var el = toastEl; setTimeout(function () { el.remove(); }, 4200);
  }

  /* ---------- lưu trên máy (an toàn khi trình duyệt chặn) ---------- */
  var mem = {};
  var GLOBAL_KEYS = { learner: 1, slow: 1, uid: 1 };
  function slug(t) {
    return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }
  var store = {
    who: '',
    // mỗi học viên (theo tên) có kho kết quả riêng trên cùng một máy; cả 5 trang dùng chung kho này
    full: function (k, who) { var w = GLOBAL_KEYS[k] ? '' : (who === undefined ? this.who : who); return 'vstep2.' + (w ? 'u_' + w + '.' : '') + k; },
    raw: function (fk, d) {
      try { var v = localStorage.getItem(fk); if (v !== null) return JSON.parse(v); } catch (e) { }
      return (fk in mem) ? mem[fk] : d;
    },
    get: function (k, d) { return this.raw(this.full(k), d); },
    set: function (k, v) { var fk = this.full(k); mem[fk] = v; try { localStorage.setItem(fk, JSON.stringify(v)); } catch (e) { } }
  };
  store.who = slug(store.get('learner', '') || C.studentName || '');
  function learnerName() { return String(store.get('learner', '') || C.studentName || '').trim(); }
  function setLearner(n) {
    n = String(n || '').trim().replace(/\s+/g, ' ');
    var anon = store.raw(store.full('results', ''), []), anonTarget = store.raw(store.full('target', ''), '');
    store.set('learner', n); store.who = slug(n);
    if (n && anonTarget && !store.get('target', '')) store.set('target', anonTarget);
    // bài làm trước khi nhập tên được chuyển sang tên vừa nhập
    if (n && anon.length && !store.get('results', []).length) {
      store.set('results', anon);
      try { localStorage.removeItem(store.full('results', '')); } catch (e) { }
      delete mem[store.full('results', '')];
    }
    return n;
  }
  function uid() { var u = store.get('uid', ''); if (!u) { u = Math.random().toString(36).slice(2, 8); store.set('uid', u); } return u; }

  /* ---------- kết quả làm bài ----------
     Mỗi bài làm xong, trang kỹ năng gọi V.results.add({...}) với:
       skill: 'nghe' | 'noi' | 'doc' | 'viet'
       kind:  'luyen-tap' | 'tu-vung'
       title: tên bài, ví dụ "Bài 1 – Phần 1"
       correct, total: số câu đúng / tổng số câu (nếu có)
       score10: điểm quy về thang 10 (nếu chấm được)                       */
  var results = {
    all: function () { return store.get('results', []); },
    of: function (skill) { return this.all().filter(function (r) { return r.skill === skill; }); },
    // sửa một kết quả đã lưu (tìm theo ts), ví dụ đánh dấu đã gửi: V.results.mark(rec.ts, {sent: true})
    mark: function (ts, patch) {
      var a = this.all();
      a.forEach(function (r) { if (r.ts === ts) for (var k in patch) r[k] = patch[k]; });
      store.set('results', a);
    },
    add: function (r) {
      var rec = { ts: Date.now() }; for (var k in r) rec[k] = r[k];
      var a = this.all(); a.unshift(rec); if (a.length > 300) a.length = 300;
      store.set('results', a); return rec;
    }
  };
  function round05(x) { return Math.round(x * 2) / 2; }
  function fmtScore(x) { return (Math.round(x * 10) / 10).toFixed(1); }
  // quy điểm trung bình (đã làm tròn 0,5) ra bậc VSTEP.3-5
  function bandOf(score) {
    var s = round05(score);
    if (s >= 8.5) return { key: 'c1', t: 'C1', name: 'Bậc 5' };
    if (s >= 6) return { key: 'b2', t: 'B2', name: 'Bậc 4' };
    if (s >= 4) return { key: 'b1', t: 'B1', name: 'Bậc 3' };
    return { key: 'none', t: 'Chưa đạt B1', name: '' };
  }
  // bậc mục tiêu học viên tự chọn (lưu theo tên học viên)
  var TARGETS = [
    { key: 'b1', t: 'B1', name: 'Bậc 3', min: 4, range: '4.0 – 5.5' },
    { key: 'b2', t: 'B2', name: 'Bậc 4', min: 6, range: '6.0 – 8.0' },
    { key: 'c1', t: 'C1', name: 'Bậc 5', min: 8.5, range: '8.5 – 10' }
  ];
  function target() {
    var k = store.get('target', '') || String(C.defaultTarget || 'b1').toLowerCase(), out = TARGETS[0];
    TARGETS.forEach(function (t) { if (t.key === k) out = t; });
    return out;
  }
  function setTarget(k) { store.set('target', k); }
  function dateShort(ts) { var d = new Date(ts); return d.getDate() + '/' + (d.getMonth() + 1); }

  /* ---------- liên kết giữa các trang ---------- */
  function onSites() {
    try { return /(^|\.)googleusercontent\.com$/i.test(location.hostname) || /sites\.google\.com/i.test(document.referrer || ''); } catch (e) { return false; }
  }
  function linkMode() { var m = C.linkMode || 'auto'; return m === 'auto' ? (onSites() ? 'site' : 'file') : m; }
  function linkFor(key, hash) {
    var u = '';
    if (linkMode() === 'site') {
      u = String((C.links || {})[key] || '').trim();
      if (u && !/^https?:\/\//i.test(u)) { var base = String(C.siteUrl || '').trim().replace(/\/+$/, ''); u = base ? base + '/' + u.replace(/^\/+/, '') : ''; }
      return u;                       // Google Sites không chuyển được phần #... vào trang nhúng
    }
    u = String((C.files || {})[key] || '').trim();
    return u ? u + (hash ? '#' + hash : '') : '';
  }
  // Trong Google Sites: thử chuyển trang ngay trong tab; nếu bị chặn thì sau 0,45 giây mở tab mới.
  function go(url) {
    var left = false, mark = function () { left = true; };
    window.addEventListener('beforeunload', mark); window.addEventListener('pagehide', mark);
    var framed = true;
    try { framed = window.top !== window.self; } catch (e) { framed = true; }
    try { if (framed) window.top.location.href = url; else { window.location.href = url; return; } } catch (e) { }
    setTimeout(function () {
      if (left) return;
      var w = null;
      try { w = window.open(url, '_blank'); if (w) w.opener = null; } catch (e2) { }
      if (!w) toast('Trình duyệt chặn mở trang. Hãy chọn trang ở menu phía trên của site.');
    }, 450);
  }
  // tạo một liên kết tới trang khác: V.link('nghe', {class:'btn'}, 'Luyện tập') hoặc V.link('nghe#tu-vung', ...)
  function link(target, attrs) {
    var parts = String(target).split('#'), key = parts[0], hash = parts[1] || '';
    var url = linkFor(key, hash), kids = Array.prototype.slice.call(arguments, 2), a;
    attrs = attrs || {};
    if (!url) {
      attrs.type = 'button';
      a = h('button', attrs, kids);
      a.addEventListener('click', function () { toast('Trang này chưa được gắn link. Hãy chọn trang ở menu phía trên của site.'); });
      return a;
    }
    attrs.href = url;
    if (linkMode() === 'site') { attrs.target = '_top'; attrs.rel = 'noopener'; }
    a = h('a', attrs, kids);
    if (linkMode() === 'site') a.addEventListener('click', function (e) { e.preventDefault(); go(url); });
    return a;
  }
  function pageInfo(key) { for (var i = 0; i < PAGES.length; i++) if (PAGES[i].key === key) return PAGES[i]; return PAGES[0]; }

  /* ---------- khung trang: menu, tiêu đề, chuyển trang, chân trang ---------- */
  var whoEl = null;
  function drawWho() {
    if (!whoEl) return;
    clear(whoEl); var n = learnerName();
    if (n) add(whoEl, ['Học viên: ', h('b', null, n)]);
  }
  function nav() {
    whoEl = h('span', { class: 'nav-who' });
    drawWho();
    return h('header', { class: 'nav' }, h('div', { class: 'nav-in' },
      link('home', { class: 'brand' }, C.brand || 'Ôn thi VSTEP', h('span', { class: 'lvl' }, C.level || 'B1–C1')),
      whoEl,
      h('nav', { class: 'nav-links', 'aria-label': 'Các trang' }, PAGES.map(function (p) {
        return link(p.key, { class: 'nav-a' + (p.key === PAGE ? ' on' : ''), 'aria-current': p.key === PAGE ? 'page' : null }, p.t);
      }))));
  }
  function pageHead(title, tag, sub) {
    return h('div', { class: 'pagehead' },
      h('h1', null, title, tag ? h('span', { class: 'lvl' }, tag) : null),
      sub ? h('p', null, sub) : null);
  }
  function section(title, sub) {
    var s = h('section', { class: 'sec' }, h('h2', null, title), sub ? h('p', { class: 'sub' }, sub) : null);
    for (var i = 2; i < arguments.length; i++) add(s, arguments[i]);
    return s;
  }
  function pager() {
    var i = 0; PAGES.forEach(function (p, k) { if (p.key === PAGE) i = k; });
    var prev = PAGES[i - 1], next = PAGES[i + 1];
    return h('nav', { class: 'pager', 'aria-label': 'Trang trước và trang sau' },
      prev ? link(prev.key, { class: 'prev' }, h('span', { class: 'dir' }, 'Trang trước'), h('span', { class: 'nm' }, prev.t)) : null,
      next ? link(next.key, { class: 'next' }, h('span', { class: 'dir' }, 'Trang sau'), h('span', { class: 'nm' }, next.t)) : null);
  }
  function teacher() { return String(C.teacherName || '').trim() || 'giáo viên'; }
  function cap(s) { s = String(s); return s.charAt(0).toUpperCase() + s.slice(1); }
  function mount(render) {
    var body = document.body; clear(body);
    var root = h('main', { class: 'wrap', id: 'app' });
    var navEl = nav();
    body.appendChild(navEl);
    // chiều cao thanh menu, để các thanh dính bên dưới không bị che
    var setNavH = function () { document.documentElement.style.setProperty('--navh', navEl.offsetHeight + 'px'); };
    setNavH(); window.addEventListener('resize', setNavH); window.addEventListener('load', setNavH);
    body.appendChild(root);
    render(root);
    audioCheck(root);
    root.appendChild(h('footer', { class: 'foot' },
      (C.brand || 'Ôn thi VSTEP') + ' ' + (C.level || 'B1–C1') + '. Kết quả làm bài được lưu trên máy này' + (sheetOn() ? ' và gửi về bảng điểm của ' + teacher() + '.' : '.')));
  }

  /* ---------- ô nhập tên học viên ---------- */
  function learnerBox(onChange) {
    var box = h('div', { class: 'learner' });
    function draw(edit) {
      clear(box);
      var name = learnerName();
      if (name && !edit) {
        add(box, [h('div', { class: 'lb-name' }, h('span', { class: 'muted small' }, 'Học viên'), h('b', null, name)),
          h('button', { class: 'btn small', type: 'button', onclick: function () { draw(true); } }, 'Đổi tên')]);
        return;
      }
      var inp = h('input', { class: 'field', type: 'text', id: 'lb-inp', maxlength: '60', autocomplete: 'name', placeholder: 'Nguyễn Văn An – lớp K12', value: name });
      var save = function () {
        var v = inp.value.trim();
        if (v.length < 2) { toast('Hãy nhập họ tên (ít nhất 2 ký tự).'); inp.focus(); return; }
        setLearner(v); drawWho(); draw(false); onChange && onChange();
      };
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') save(); });
      add(box, [h('label', { for: 'lb-inp', class: 'lb-label' }, 'Họ tên của bạn'),
        h('div', { class: 'lb-row' }, inp, h('button', { class: 'btn primary', type: 'button', onclick: save }, 'Lưu tên')),
        h('p', { class: 'small muted' }, 'Tên dùng để lưu bài làm và để ' + teacher() + ' biết bài của ai. Ghi thêm lớp để không trùng tên.')]);
    }
    draw(false);
    return box;
  }

  /* ---------- âm thanh: file ghi sẵn trong thư mục audio/ ---------- */
  function audioUrl(path) { return String(C.audioBase === undefined ? 'audio/' : C.audioBase) + path; }
  function isSlow() { return !!store.get('slow', false); }
  // dự phòng khi thiếu file: dùng giọng tiếng Anh có sẵn của trình duyệt
  var TTS = {
    ok: 'speechSynthesis' in window, voice: null,
    pick: function () {
      if (!this.ok) return null;
      var v = speechSynthesis.getVoices().filter(function (x) { return /^en[-_]/i.test(x.lang); });
      v.sort(function (a, b) { return (/en[-_]GB/i.test(b.lang) ? 1 : 0) - (/en[-_]GB/i.test(a.lang) ? 1 : 0); });
      this.voice = v[0] || null; return this.voice;
    },
    stop: function () { if (this.ok) speechSynthesis.cancel(); },
    say: function (text, opts) {
      opts = opts || {};
      if (!this.ok) { opts.onend && opts.onend(); return; }
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(String(text)), voice = this.voice || this.pick();
      if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-GB';
      u.rate = opts.rate || 0.9;
      var ended = false, end = function () { if (!ended) { ended = true; opts.onend && opts.onend(); } };
      u.onend = end; u.onerror = end;
      setTimeout(end, 8000 + String(text).length * 120);
      speechSynthesis.speak(u);
    }
  };
  if (TTS.ok) { TTS.pick(); try { speechSynthesis.addEventListener('voiceschanged', function () { TTS.pick(); }); } catch (e) { } }
  var curClip = null;
  function stopClip() {
    if (curClip) { try { curClip.pause(); } catch (e) { } curClip = null; }
    TTS.stop();
    Array.prototype.forEach.call(document.querySelectorAll('.playing'), function (el) { el.classList.remove('playing'); });

  function sheetUrl() { return String(C.sheetUrl || '').trim(); }

  function postSheet(payload, cb) {

    var done = function (ok) { if (!finished) { finished = true; cb && cb(ok); } };

        document.body.appendChild(ifr); document.body.appendChild(f);
        var t = setTimeout(function () { done(false); }, 25000);
        ifr.addEventListener('load', function () { clearTimeout(t); done(true); setTimeout(function () { ifr.remove(); f.remove(); }, 2000); });

      } catch (e) { done(false); }
    }
    try {
      fetch(url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'payload=' + encodeURIComponent(json) })

  // audio (tuỳ chọn): [{name, type, b64}] – bản ghi âm bài Nói gửi kèm
  function send(skill, row, cb, audio) {

  // trang không đọc được câu trả lời của lệnh gửi, nên hỏi lại Sheet xem bài mang mã này đã vào bảng chưa

  function jsonp(params, cb) {
    var cbName = '__vjp' + Date.now() + Math.floor(Math.random() * 1000), finished = false;

    setTimeout(function () { end(new Error('timeout')); }, 20000);
    document.head.appendChild(sc);
  }
  // điểm và nhận xét giáo viên đã chấm cho học viên này (đọc từ Google Sheet)
  function feedback(cb) {

      return h('article', { class: 'item' }, h('h3', null, head), body,
        h('div', { class: 'acts' }, askBtn(test, it, 'Nghe giám khảo đọc')), mine(it), modelBox(it), hint('Dàn ý của bài mẫu', it.outline));
    }
    parts.forEach(function (p) {
      panel.appendChild(h('h2', { class: 'parthead' }, p.title + ': ' + p.name, h('span', { class: 'pill blue' }, p.level)));
      if (p.id === 'p1') test.p1.forEach(function (tp, ti) {
        var card = h('article', { class: 'item' }, h('h3', null, 'Chủ đề ' + (ti + 1) + ': ', h('span', { lang: 'en' }, tp.topic), ' (' + tp.vi + ')'));
        test.items.p1.forEach(function (it) { if (it.topic === ti) card.appendChild(qRev(it)); });
        panel.appendChild(card);
      });
      if (p.id === 'p2') panel.appendChild(longRev(test.items.p2[0], 'Tình huống', sitBlock(test.p2)));
      if (p.id === 'p3') {
        panel.appendChild(longRev(test.items.p3[0], 'Chủ đề', mind(test.p3)));
        var card = h('article', { class: 'item' }, h('h3', null, 'Câu hỏi thêm'));
        test.items.p3.forEach(function (it) { if (it.kind === 'fu') card.appendChild(qRev(it)); });
        panel.appendChild(card);
      }
    });
    if (!viewOnly && spoken.length) panel.appendChild(assess());
    panel.appendChild(h('div', { class: 'row', style: { marginTop: '18px' } },
      h('button', { class: 'btn primary', type: 'button', onclick: again }, viewOnly ? 'Luyện đề này' : 'Luyện lại'),
      h('button', { class: 'btn', type: 'button', onclick: back }, 'Về danh sách đề')));

    /* ---------- tự chấm theo 5 tiêu chí của bài thi Nói ---------- */
    function assess() {
      var box = h('section', { class: 'assess' }), pick = {}, warn = h('div');
      var sendAudio = h('input', { type: 'checkbox', id: 'noi-send-audio', checked: true });
      box.appendChild(h('h2', null, 'Tự chấm bài nói'));
      box.appendChild(h('p', { class: 'muted', style: { maxWidth: '72ch' } }, 'Bài thi Nói được chấm theo 5 tiêu chí. Ở mỗi tiêu chí, chọn dòng giống bài nói của bạn nhất. Chấm thật với mình thì mới biết cần luyện gì.'));
      CRIT.forEach(function (c, ci) {
        var fs = h('fieldset', { class: 'q' }, h('legend', null, (ci + 1) + '. ' + c[0]));
        c[1].forEach(function (text, li) {
          var id = 'cr' + ci + '-' + li, r = h('input', { type: 'radio', name: 'cr' + ci, id: id });
          r.addEventListener('change', function () { pick[ci] = li; V.clear(warn); });
          fs.appendChild(h('label', { class: 'opt', for: id }, r, h('span', { class: 'lv' }, LEVELS[li][0]), h('span', null, text)));
        });
        box.appendChild(fs);
      });
      if (V.sheetOn() && hasAudio) box.appendChild(h('label', { class: 'send', for: 'noi-send-audio' }, sendAudio,
        h('span', null, 'Gửi kèm các bản ghi âm để ' + V.teacher() + ' nghe và chấm. Bỏ chọn nếu bạn chỉ muốn gửi điểm tự chấm.')));
      box.appendChild(warn);
      box.appendChild(h('div', { class: 'row', style: { marginTop: '16px' } }, h('button', { class: 'btn primary', type: 'button', onclick: save }, 'Lưu kết quả')));
      function save() {
        var left = CRIT.length - Object.keys(pick).length;
        if (left > 0) {
          V.clear(warn).appendChild(h('div', { class: 'notice warn', style: { marginTop: '14px' }, role: 'alert' }, 'Còn ' + left + ' tiêu chí chưa chọn.'));
          return;
        }
        var sum = 0, low = 0;
        CRIT.forEach(function (c, ci) { sum += LEVELS[pick[ci]][1]; if (pick[ci] < pick[low]) low = ci; });
        var score10 = Math.round(sum / CRIT.length * 10) / 10, whole = parts.length === PARTS.length;
        var detail = CRIT.map(function (c, ci) { return c[0] + ': ' + LEVELS[pick[ci]][0]; }).join('; ');
        var rec = V.results.add({ skill: 'noi', kind: 'luyen-tap', title: title, score10: score10, full: whole, self: true, sent: false });
        var band = V.bandOf(score10), tg = V.target(), s05 = V.round05(score10), sendBox = h('p', { class: 'small muted', role: 'status' });
        var verdict = 'Điểm Nói tự chấm: ' + V.fmtScore(s05) + '/10, ' + (band.key === 'none' ? 'chưa tới mốc B1' : 'tương đương ' + band.t) + '. ' +
          (s05 >= tg.min ? 'Theo tự chấm, bạn đã ở mốc mục tiêu ' + tg.t + '.' : 'Mốc mục tiêu ' + tg.t + ' cần từ ' + V.fmtScore(tg.min) + ' điểm.') +
          ' Tiêu chí nên luyện trước: ' + CRIT[low][0] + '. ' + CRIT[low][2];
        V.clear(box).classList.remove('assess'); box.style.marginTop = '26px';
        box.appendChild(h('div', { class: 'score' },
          h('div', { class: 'big' }, V.fmtScore(s05), h('span', null, ' /10 tự chấm')),
          h('div', null, h('b', null, title), h('p', null, verdict), sendBox)));
        box.scrollIntoView({ block: 'center' });
        var row = { 'Đề': test.title, 'Phần': whole ? 'Cả đề' : parts[0].title, 'Kết quả': spoken.length + '/' + its.length + ' lượt nói, ' + dura(secs),
          'Tự chấm /10': V.fmtScore(score10), 'Chi tiết tự chấm': detail, 'Mục tiêu': tg.t };
        function send() {
          if (!V.sheetOn()) {
            sendBox.textContent = 'Kết quả đã được lưu trên máy này. Điểm thật do giám khảo chấm' + (hasAudio ? '; hãy bấm Tải về ở từng bản ghi rồi gửi cho ' + V.teacher() + ' để được chấm và nhận xét.' : '.');
            return;
          }
          sendBox.textContent = 'Đang gửi cho ' + V.teacher() + '…';
          pack(sendAudio.checked, function (audio, tooBig) {
            V.send('noi', row, function (ok) {
              V.clear(sendBox);
              if (ok) {
                V.results.mark(rec.ts, { sent: true });
                sendBox.textContent = 'Đã lưu và gửi cho ' + V.teacher() + (audio.length ? ' kèm ' + audio.length + ' bản ghi âm.' : '.') +
                  (tooBig ? ' Bản ghi âm quá lớn nên chưa gửi kèm được; hãy tải về và gửi riêng.' : '') + ' Điểm và nhận xét của ' + V.teacher() + ' sẽ hiện ở danh sách đề.';
              } else V.add(sendBox, ['Đã lưu trên máy này nhưng chưa gửi được cho ' + V.teacher() + '. ', h('button', { class: 'btn small', type: 'button', onclick: send }, 'Gửi lại')]);
            }, audio);
          });
        }
        send();
      }
      // đổi các bản ghi thành chữ (base64) để gửi kèm về Google Sheet
      function pack(want, cb) {
        var list = want ? spoken.filter(function (it) { return takes[it.key].blob; }) : [], size = 0, out = [], i = 0;
        list.forEach(function (it) { size += takes[it.key].blob.size; });
        if (!list.length || size > 9e6) { cb([], size > 9e6); return; }
        (function next() {
          if (i >= list.length) { cb(out, false); return; }
          var it = list[i++], tk = takes[it.key], fr = new FileReader();
          fr.onload = function () { out.push({ name: test.title + ' - ' + it.label + extOf(tk.type), type: tk.type, b64: String(fr.result).split(',')[1] || '' }); next(); };
          fr.onerror = next;
          fr.readAsDataURL(tk.blob);
        })();
      }
      return box;
    }
  }

  /* ================= KHUNG TRANG ================= */
  function draw() {
    V.clear(bar);
    TABS.forEach(function (t) {
      bar.appendChild(h('button', { class: 'tab' + (t[0] === tab ? ' on' : ''), type: 'button', role: 'tab', 'aria-selected': t[0] === tab ? 'true' : 'false',
        onclick: function () { tab = t[0]; try { history.replaceState(null, '', '#' + tab); } catch (e) { } draw(); } }, t[1]));
    });
    if (tab === 'tu-vung') { cleanup(); doing(false); V.vocabTab(panel, { skill: 'noi', groups: D.vocab, source: 'nhóm cụm từ hay dùng ở', listenFirst: false }); } else listView();
  }
  V.mount(function (root) {
    bar = h('div', { class: 'tabs', role: 'tablist' }); panel = h('div', { role: 'tabpanel' });
    window.addEventListener('hashchange', function () { tab = hashTab(); draw(); });
    root.appendChild(V.pageHead('Nói', 'Speaking', 'Bài nói theo đúng định dạng VSTEP.3-5: 3 phần trong 12 phút. Nghe giám khảo hỏi, ghi âm câu trả lời, nghe lại và so với bài nói mẫu.'));
    root.appendChild(h('div', { style: { marginTop: '14px' } }, V.learnerBox(function () { draw(); })));
    root.appendChild(bar); root.appendChild(panel);
    draw();
    root.appendChild(V.pager());
  });
})();
</script>
</body>
</html>
