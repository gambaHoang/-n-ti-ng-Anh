<html lang="vi">
<head>

<script>
/* ================================================================
   CÀI ĐẶT — chỉ cần sửa phần này (giữ nguyên dấu ngoặc kép "")
   Phần này giống nhau ở cả 5 trang: sửa ở trang nào thì sửa luôn 4 trang còn lại.
   ================================================================ */
window.VSTEP_CONFIG = {
  brand: "Ôn thi VSTEP",          // tên hiện ở góc trái thanh menu
  levelName: "Bậc 3–5",           // các bậc khoá học luyện
  level: "B1–C1",
  defaultTarget: "b1",            // bậc mục tiêu khi học viên chưa tự chọn: "b1", "b2" hoặc "c1"
  studentName: "",                // tên học viên (tuỳ chọn) — để "" thì web dùng chung cho mọi người
  examDate: "",                   // ngày thi chung, dạng "2026-12-12" — để "" thì học viên tự chọn
  sheetUrl: "",                   // link Ứng dụng web Google Sheet (…/exec) của RIÊNG trang này để nhận kết quả — để "" thì kết quả chỉ lưu trên máy học viên
  teacherName: "thầy Hoàng",      // tên người chữa bài, ví dụ "cô Lan" — để "" sẽ hiện là "giáo viên"
  teacherEmail: "",               // email nhận bài Viết/Nói của học viên (để "" nếu không dùng)

  // CÁC FILE CỦA TRANG — đặt chung một thư mục, giữ nguyên tên
  linkMode: "file",
  files: { home: "index.html", nghe: "nghe.html", noi: "noi.html", doc: "doc.html", viet: "viet.html" },
  audioBase: "audio/"             // thư mục chứa file nghe và file phát âm, đặt cạnh các file .html
};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== GIAO DIỆN DÙNG CHUNG (giống nhau ở mọi trang) ===== */
:root{
  --bg:#f4f5f9; --grid:#e6e9f0; --card:#fff; --ink:#1b2130; --muted:#5d6577; --line:#dfe3ea;
  --blue-50:#e6f0ff; --blue-100:#d6e6ff; --blue-200:#b7cff5; --blue-400:#6f9fe6; --blue-600:#2563eb; --blue-700:#1d4ed8; --blue-900:#123a7a;
  --red:#c62828; --ok:#15803d; --ok-soft:#e8f6ec; --bad:#b42318; --bad-soft:#fdecea; --warn:#8a4f06; --warn-soft:#fff5e0;
  --font:"Be Vietnam Pro","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-700)}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--blue-600);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
.muted{color:var(--muted)}
.small{font-size:.9rem}

/* thanh menu */
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.nav-in{max-width:1040px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.12rem;color:var(--ink);text-decoration:none;white-space:nowrap;padding:6px 0;background:none;border:0;cursor:pointer}
.brand .lvl{color:var(--red);font-weight:400;margin-left:7px}
.nav-links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.nav-links::-webkit-scrollbar{display:none}
.nav-a{white-space:nowrap;padding:8px 14px;border-radius:999px;font-weight:600;font-size:.98rem;color:var(--ink);text-decoration:none;border:1px solid transparent;background:none;cursor:pointer;line-height:1.3}
.nav-a:hover{background:var(--blue-50);border-color:var(--blue-200)}
.nav-a.on{background:var(--ink);color:#fff}
.nav-who{font-size:.9rem;color:var(--muted);white-space:nowrap;max-width:230px;min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.nav-who b{color:var(--ink);font-weight:600}
@media(max-width:700px){
  .nav-in{padding:6px 14px}
  .nav-links{order:3;width:100%;margin-left:-6px}
  .nav-who{display:none}
  .brand{padding:4px 0}
  .nav-a{padding:7px 12px}
}

/* nút */
.btn{appearance:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;line-height:1.25;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#aeb7c7}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.btn.blue{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
.btn.blue:hover{background:var(--blue-700);border-color:var(--blue-700)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.9rem;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:0 0 auto}

/* khối nội dung */
.sec{padding:34px 0 0}
.sec > h2{font-size:1.45rem;font-weight:800;letter-spacing:-.01em;line-height:1.25;margin-bottom:6px}
.sec > .sub{color:var(--muted);margin-bottom:14px;max-width:68ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.notice{border-radius:12px;padding:10px 14px;background:var(--blue-50);color:var(--blue-900);font-size:.95rem}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.ok{background:var(--ok-soft);color:#14532d}
.notice.bad{background:var(--bad-soft);color:#7f1d1d}
.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;background:#eceef4;font-weight:600;font-size:.85rem;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.blue{background:var(--blue-50);color:var(--blue-900)}
.field{border:1px solid #b9c1cf;border-radius:10px;padding:9px 12px;min-height:44px;background:#fff;min-width:0}
.field:focus{outline:3px solid var(--blue-200);outline-offset:0;border-color:var(--blue-600)}

/* bảng */
.tblwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
.tbl{width:100%;border-collapse:collapse;font-size:.98rem}
.tbl th,.tbl td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:.88rem;color:var(--muted);font-weight:600;background:#fafbfd;white-space:nowrap}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.hl td{background:var(--blue-50)}
.tbl td.nw{white-space:nowrap}
/* màn hình hẹp: mỗi dòng của bảng thành một khối xếp dọc */
@media(max-width:700px){
  .tbl.stack thead{display:none}
  .tbl.stack,.tbl.stack tbody{display:block}
  .tbl.stack tr{display:block;padding:12px 16px;border-bottom:1px solid var(--line)}
  .tbl.stack tr:last-child{border-bottom:0}
  .tbl.stack td{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:3px 0;border:0;text-align:right;white-space:normal}
  .tbl.stack td::before{content:attr(data-label);color:var(--muted);font-size:.88rem;text-align:left;flex:0 0 auto}
  .tbl.stack td:first-child{font-size:1.05rem;padding-bottom:5px}
  .tbl.stack td:first-child::before,.tbl.stack td.long::before{content:none}
  .tbl.stack td.long{display:block;text-align:left;padding-top:6px}
}

/* tiêu đề trang con + thẻ chuyển phần */
.pagehead{padding:30px 0 6px}
.pagehead h1{font-size:clamp(2rem,5vw,2.6rem);font-weight:800;letter-spacing:-.02em;line-height:1.15}
.pagehead h1 .lvl{color:var(--red);font-weight:400;font-size:.62em;margin-left:12px;letter-spacing:0}
.pagehead p{color:var(--muted);font-size:1.05rem;margin-top:8px;max-width:64ch}
.tabs{display:flex;gap:6px;margin:18px 0 16px;border-bottom:1px solid var(--line)}
.tab{padding:10px 18px;border:1px solid transparent;border-bottom:0;border-radius:12px 12px 0 0;font-weight:700;color:var(--muted);text-decoration:none;background:none;cursor:pointer;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{background:#fff;border-color:var(--line);color:var(--ink)}
.empty{background:#fff;border:1px dashed #b9c1cf;border-radius:14px;padding:28px 22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:4px}

/* ô nhập họ tên học viên */
.learner{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.learner .lb-label{font-weight:700;width:100%}
.learner .lb-row{display:flex;gap:8px;width:100%}
.learner .lb-row .field{flex:1 1 auto}
.learner .btn{white-space:nowrap}
.learner .lb-name{display:flex;flex-direction:column;line-height:1.35}
.learner .lb-name b{font-size:1.15rem}
.learner p{width:100%}
.ipa{color:var(--blue-900);font-family:"Segoe UI","Lucida Sans Unicode","Arial Unicode MS",sans-serif}

/* nhóm nút chọn một trong vài mục */
.pick{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:.95rem;font-weight:600}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{appearance:none;border:0;border-left:1.5px solid var(--ink);background:#fff;padding:6px 16px;font-weight:700;cursor:pointer;min-height:38px;min-width:54px}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--blue-50)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button:focus-visible{outline-offset:-3px}

/* thẻ từ vựng có nút nghe phát âm */
.words{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.word{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.word .w{font-size:1.3rem;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.word .pos{font-size:.82rem;color:var(--muted);font-weight:400;margin-left:6px}
.word .ipa{color:var(--blue-900);font-family:"Segoe UI","Lucida Sans Unicode","Arial Unicode MS",sans-serif;font-size:.98rem}
.word .vi{font-weight:600;margin-top:4px}
.word .ex{color:var(--muted);font-size:.92rem;line-height:1.5;margin-top:2px}
.word .say{margin-top:auto;padding-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.word .say .btn{white-space:nowrap;padding:6px 10px}
.btn.playing{background:var(--blue-50);border-color:var(--blue-400)}

/* chuyển trang trước / sau */
.pager{display:flex;justify-content:space-between;gap:12px;margin:36px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.pager a,.pager button{display:flex;flex-direction:column;gap:0;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:140px;cursor:pointer;text-align:left}
.pager a:hover,.pager button:hover{border-color:var(--blue-400);background:var(--blue-50)}
.pager .dir{font-size:.82rem;color:var(--muted)}
.pager .nm{font-weight:700}
.pager .next{text-align:right;margin-left:auto}

.foot{margin-top:44px;padding:18px 0 34px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:92vw;font-size:.95rem}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
@media print{.nav,.pager,.btn{display:none!important}body{background:#fff}}
.audiowarn{margin-top:16px;padding:14px 18px}
.audiowarn ul{margin:6px 0 6px;padding-left:20px}
.audiowarn li{margin-top:4px}
/* ===== LUYỆN TẬP: danh sách bài, làm bài, chấm, chữa (dùng chung cho Nghe và Đọc) ===== */
.test{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px 8px;margin-bottom:18px}
.test h2{font-size:1.35rem;font-weight:800;margin-bottom:4px}
.parts{list-style:none;margin:0;padding:0}
.parts li{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px 18px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.parts li:first-child{border-top:0}
.parts .pt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.parts .pt b{font-size:1.08rem}
.parts .pd{color:var(--muted);font-size:.95rem}
.parts .last{display:block;color:var(--blue-900);font-weight:600;margin-top:2px}
.parts .btn{min-width:128px}
@media(max-width:700px){.parts li{grid-template-columns:1fr}.parts .btn{width:100%}}

.dobar{position:sticky;top:calc(var(--navh, 57px) + 8px);z-index:10;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;margin-bottom:16px}
.dobar .count{margin-left:12px;font-size:.92rem;opacity:.85;font-variant-numeric:tabular-nums}
.dobar .btn.primary{background:#fff;color:var(--ink);border-color:#fff}
.dobar .btn.small{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.parthead{font-size:1.3rem;font-weight:800;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 20px 18px;margin-bottom:14px}
.item h3{font-size:1.02rem;font-weight:700;margin-bottom:10px}
.player audio{width:100%;max-width:560px;display:block;height:44px}
.player .notice{margin-top:8px}
.q{border:0;margin:16px 0 0;padding:0;min-width:0}
.q legend,.q .qt{font-weight:600;padding:0;margin-bottom:8px;line-height:1.45}
.q .qn{color:var(--blue-900);font-weight:800}
.opt{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;margin-top:6px;cursor:pointer;line-height:1.4}
label.opt:hover{border-color:var(--blue-400);background:var(--blue-50)}
.opt input{width:19px;height:19px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--blue-600)}
.opt:has(input:checked){border-color:var(--blue-600);background:var(--blue-50)}
.opt .lt{font-weight:800;min-width:1.1em}
.q.rev .opt{cursor:default}
.q.rev .qt .pill{margin-left:8px;vertical-align:1px}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .tag{margin-left:auto;font-size:.82rem;font-weight:700;white-space:nowrap;padding-left:10px}
.opt.right .tag{color:var(--ok)}
.opt.wrong .tag{color:var(--bad)}
.why{margin-top:8px;padding:10px 14px;border-left:3px solid var(--blue-400);background:#f7f9fd;border-radius:0 10px 10px 0;font-size:.95rem}
.why .ev{font-style:italic;color:var(--blue-900);margin-bottom:4px}
.script{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.script summary{cursor:pointer;font-weight:700;color:var(--blue-700)}
.script p{margin-top:8px;max-width:72ch}

.score{display:flex;flex-wrap:wrap;gap:8px 26px;align-items:center;background:#fff;border:1.5px solid var(--ink);border-radius:16px;padding:18px 22px}
.score .big{font-size:2.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.score .big span{font-size:1rem;font-weight:600;letter-spacing:0;color:var(--muted)}
.score > div:last-child{flex:1 1 300px}
.score p{margin-top:2px;max-width:66ch}

.vbar{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.vbar .seg button{padding:6px 12px;font-size:.92rem}
.quiz{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;max-width:640px}
.quiz .qhead{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px}
.quiz > p{margin-bottom:12px}
.qopts{display:grid;gap:8px;margin-top:16px}
.qopts .btn{justify-content:flex-start;text-align:left}
.qopts .btn.right{border-color:var(--ok);background:var(--ok-soft);opacity:1}
.qopts .btn.wrong{border-color:var(--bad);background:var(--bad-soft);opacity:1}
.qfb{margin-top:14px}
.qfb p{margin-bottom:10px}
.qfb .qw{font-weight:800}
.qword{font-size:1.9rem;font-weight:800;letter-spacing:-.01em;margin:2px 0 12px}
/* đang làm bài: thanh menu không dính nữa để dành chỗ cho bài */
body.doing{--navh:0px}
body.doing .nav{position:static}
@media(max-width:700px){
  .dobar{padding:8px 12px;flex-wrap:nowrap}
  .dobar b,.dobar .count .long{display:none}
  .dobar .count{margin-left:0}
  .dobar .btn{min-height:38px;padding:6px 12px}
}
@media(max-width:700px){
  .dobar > div{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;white-space:nowrap}
  .dobar .clock{margin-left:0}
}
@media(max-width:700px){
  .dobar{gap:6px}
  .dobar .row{gap:6px;flex-wrap:nowrap}
  .dobar .btn{padding:6px 10px}
}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{appearance:none;border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:6px 16px;font-weight:700;cursor:pointer;min-height:38px}
.chips button:hover{background:var(--blue-50)}
.chips button[aria-pressed="true"]{background:var(--ink);color:#fff}
.chips button .done{font-weight:400;font-size:.85rem;margin-left:6px;opacity:.8}
.testpick{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:14px;font-weight:600}
/* ===== TRANG NÓI: lượt nói có ghi âm, sơ đồ chủ đề, bài nói mẫu, tự chấm ===== */
.sq{padding:14px 0 6px;border-top:1px solid var(--line)}
.item h3 + .sq{border-top:0;padding-top:2px}
.sq .qt{font-weight:600;line-height:1.45;margin-bottom:10px}
.sq .qn{color:var(--blue-900);font-weight:800}
.qx.veil{filter:blur(7px);cursor:pointer;user-select:none}
.acts{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.speak{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;min-height:44px;flex:1 1 280px;min-width:0}
.item > .speak{margin-top:12px}
.speak audio,.mine audio{height:40px;flex:1 1 220px;min-width:0;max-width:420px}
.speak .clock,.prep .clock{font-variant-numeric:tabular-nums;font-weight:800}
.speak .lim{color:var(--muted);font-size:.9rem;white-space:nowrap}
.btn.rec{border-color:var(--bad);color:var(--bad)}
.btn.rec:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn.stop{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.stop:hover{border-color:var(--bad)}
.speak .dot,.btn .dot{width:11px;height:11px;border-radius:50%;background:var(--bad);display:inline-block;flex:0 0 auto}
.btn .sqr{width:11px;height:11px;border-radius:2px;background:#fff;display:inline-block;flex:0 0 auto}
.speak.live > .dot{animation:noi-pulse 1.1s ease-in-out infinite}
@keyframes noi-pulse{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.speak.live > .dot{animation:none}}
.recbar{flex:1 1 120px;height:8px;border-radius:99px;background:#eceef4;overflow:hidden;min-width:80px;max-width:320px}
.recbar i{display:block;height:100%;width:0;background:var(--bad)}
.prep{display:inline-flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:600}
.btn.small svg{width:16px;height:16px}

.sit{font-size:1.05rem;max-width:70ch}
.opts3{margin:10px 0 14px;padding:0;list-style:none;display:grid;gap:6px;counter-reset:o;max-width:560px}
.opts3 li{counter-increment:o;border:1.5px solid var(--ink);border-radius:10px;padding:8px 14px;background:#fff;font-weight:600;display:flex;gap:10px}
.opts3 li::before{content:counter(o) ".";font-weight:800;color:var(--blue-900)}

.mind{margin:6px 0 16px}
.mm-topic{border:2px solid var(--ink);border-radius:14px;padding:12px 18px;font-weight:800;font-size:1.1rem;line-height:1.35;text-align:center;max-width:520px;margin:0 auto;background:var(--blue-50)}
.mm-ideas{list-style:none;margin:0;padding:26px 0 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;position:relative}
.mm-ideas::before{content:"";position:absolute;left:calc(12.5% - 3px);right:calc(12.5% - 5px);top:10.5px;border-top:2px solid var(--ink)}
.mm-ideas::after{content:"";position:absolute;left:50%;top:0;height:10.5px;border-left:2px solid var(--ink)}
.mm-ideas li{position:relative;border:1.5px solid var(--ink);border-radius:12px;padding:10px 10px;text-align:center;background:#fff;font-weight:600;line-height:1.35;display:flex;align-items:center;justify-content:center}
.mm-ideas li::before{content:"";position:absolute;left:50%;top:-15.5px;height:15.5px;border-left:2px solid var(--ink)}
.mm-ideas li.own{border-style:dashed;color:var(--muted);font-weight:400;font-style:italic}
@media(max-width:700px){
  .mm-ideas{grid-template-columns:repeat(2,minmax(0,1fr));padding-top:12px}
  .mm-ideas::before,.mm-ideas::after,.mm-ideas li::before{display:none}
}

.hint{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.hint summary{cursor:pointer;font-weight:700;color:var(--blue-700)}
.hint ul{margin:8px 0 0;padding-left:20px;max-width:72ch}
.hint .frame{margin-top:8px;padding:8px 12px;border-radius:10px;background:#f7f9fd;color:var(--blue-900);font-style:italic}

.mine{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.mine .lab{font-weight:700;white-space:nowrap}
.model{margin-top:12px;border:1px solid var(--line);border-left:3px solid var(--blue-400);border-radius:0 12px 12px 0;padding:12px 16px 14px;background:#f7f9fd}
.model .mh{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.model .mh b{margin-right:auto}
.model .seg button{padding:5px 12px;font-size:.9rem;min-height:36px}
.model .mtext p{margin-top:8px;max-width:72ch}
mark.hl{background:#ffec99;color:inherit;padding:0 2px;border-radius:3px}
.phr{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.phr li{background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:.9rem;line-height:1.45}
.rq{font-weight:600;line-height:1.45}

.assess{background:#fff;border:1.5px solid var(--ink);border-radius:16px;padding:18px 20px 20px;margin-top:26px}
.assess h2{font-size:1.3rem;font-weight:800;margin-bottom:4px}
.assess .q legend{font-weight:800}
.assess .opt .lv{font-weight:800;min-width:4.3em;color:var(--blue-900)}
.assess .send{display:flex;gap:10px;align-items:flex-start;margin-top:16px;line-height:1.45}
.assess .send input{width:19px;height:19px;margin-top:2px;flex:0 0 auto;accent-color:var(--blue-600)}
.fb{list-style:none;margin:0;padding:0}
.fb li{padding:10px 0;border-top:1px solid var(--line)}
.fb li:first-child{border-top:0}
.fb .when{color:var(--muted);font-size:.9rem;margin-right:8px}
.steps{margin:0 0 16px;padding-left:22px;max-width:74ch}
.steps li{margin-top:2px}
@media(max-width:700px){
  .dobar .btn .long{display:none}
  .speak{flex-basis:100%}
  .assess{padding:14px 14px 16px}
  .assess .opt{flex-wrap:wrap}
  .assess .opt .lv{min-width:0}
}
/* ===== TRANG VIẾT: đề bài, ô viết có đếm từ, bài viết của học viên, máy soát nhanh ===== */
.dobar .clock{margin-left:12px;font-variant-numeric:tabular-nums;font-weight:800}
.dobar .clock.late{color:#ffb4a8}
.prompt p{max-width:72ch;margin-top:8px}
.prompt p:first-child{margin-top:0}
.prompt .ask{font-weight:700}
.prompt ul{margin:6px 0 0;padding-left:22px;max-width:70ch}
.prompt .req{color:var(--muted);font-size:.93rem}
.msg{margin:10px 0 2px;padding:10px 16px;border-left:3px solid var(--ink);background:#f7f9fd;border-radius:0 10px 10px 0;font-style:italic;max-width:68ch}
.wbox{display:block;width:100%;min-height:260px;margin-top:14px;padding:14px 16px;border:1.5px solid var(--ink);border-radius:12px;font:inherit;font-size:1.02rem;line-height:1.7;resize:vertical;background:#fff;color:var(--ink)}
.wbox.long{min-height:440px}
.wbox:focus{outline:3px solid var(--blue-200);outline-offset:1px;border-color:var(--blue-600)}
.wcount{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:8px;font-weight:700;font-variant-numeric:tabular-nums}
.wcount .need{color:var(--muted);font-weight:400}
.mytext{white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);border-radius:12px;padding:12px 16px;background:#fff;margin-top:8px;max-width:76ch;line-height:1.7}
.mytext.none{color:var(--muted)}
.lab2{font-weight:800;margin-top:16px;display:block}
.qc{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px;max-width:76ch}
.qc li{display:flex;gap:9px;align-items:flex-start;line-height:1.45}
.qc li::before{flex:0 0 22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;color:#fff;margin-top:1px}
.qc li.ok::before{content:"✓";background:var(--ok)}
.qc li.no::before{content:"!";background:var(--bad)}
.qc li.tip::before{content:"i";background:var(--blue-600)}
.model .mtext p{white-space:pre-line}
.assess h3{font-size:1.08rem;font-weight:800;margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.assess h3:first-of-type{border-top:0;padding-top:0}
@media(max-width:700px){
  .wbox{min-height:220px;padding:12px 12px}
  .wbox.long{min-height:340px}
}
</style>
</head>

<noscript><p style="padding:20px">Trang này cần bật JavaScript để hoạt động.</p></noscript>
<script>window.VSTEP_PAGE = "viet";</script>
<script>
/* ===== LÕI DÙNG CHUNG (giống nhau ở mọi trang, không cần sửa) ===== */
(function () {
  'use strict';
  var C = window.VSTEP_CONFIG || {};
  var PAGE = window.VSTEP_PAGE || 'home';
  var PAGES = [
    { key: 'home', t: 'Trang chủ', en: 'Home' },
    { key: 'nghe', t: 'Nghe', en: 'Listening' },
    { key: 'noi', t: 'Nói', en: 'Speaking' },
    { key: 'doc', t: 'Đọc', en: 'Reading' },
    { key: 'viet', t: 'Viết', en: 'Writing' }
  ];
  var ICON = {
    nghe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4.5" height="6.5" rx="1.6"/><rect x="16.5" y="14" width="4.5" height="6.5" rx="1.6"/></svg>',
    noi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H10l-5 4v-4H4z"/><path d="M8.5 9h7M8.5 12h4.5"/></svg>',
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10 5 7 4.5 3.5 4.5v13c3.5 0 6.5.5 8.5 2 2-1.5 5-2 8.5-2v-13C17 4.5 14 5 12 6.500z"/><path d="M12 6.500v13"/></svg>',
    viet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.2-4.500L16.5 4.200l3.3 3.300L8.5 18.800z"/><path d="M14 6.700l3.3 3.3"/></svg>',
    loa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.500v5h3.500l5 4v-13l-5 4z"/><path d="M16 9a4.2 4.2 0 0 1 0 6"/><path d="M18.5 6.500a8 8 0 0 1 0 11"/></svg>'
  };

  /* ---------- DOM ---------- */
  function h(tag, attrs) {
    var el = document.createElement(tag);

      for (var k in attrs) {
        var v = attrs[k];

        else if (k.slice(0, 2) === 'on' && typeof v === 'function') el.addEventListener(k.slice(2), v);

        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (var i = 2; i < arguments.length; i++) add(el, arguments[i]);
    return el;
  }
  function add(el, kid) {
    if (kid === null || kid === undefined || kid === false) return;
    if (Array.isArray(kid)) { kid.forEach(function (k) { add(el, k); }); return; }
    if (typeof kid === 'string' || typeof kid === 'number') el.appendChild(document.createTextNode(String(kid)));
    else el.appendChild(kid);
  }
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }
  var toastEl = null;
  function toast(msg) {
    if (toastEl) toastEl.remove();
    toastEl = h('div', { class: 'toast', role: 'status' }, msg);
    document.body.appendChild(toastEl);
    var el = toastEl; setTimeout(function () { el.remove(); }, 4200);
  }

  /* ---------- lưu trên máy (an toàn khi trình duyệt chặn) ---------- */
  var mem = {};
  var GLOBAL_KEYS = { learner: 1, slow: 1, uid: 1 };
  function slug(t) {
    return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  }
  var store = {
    who: '',
    // mỗi học viên (theo tên) có kho kết quả riêng trên cùng một máy; cả 5 trang dùng chung kho này
    full: function (k, who) { var w = GLOBAL_KEYS[k] ? '' : (who === undefined ? this.who : who); return 'vstep2.' + (w ? 'u_' + w + '.' : '') + k; },
    raw: function (fk, d) {
      try { var v = localStorage.getItem(fk); if (v !== null) return JSON.parse(v); } catch (e) { }
      return (fk in mem) ? mem[fk] : d;
    },
    get: function (k, d) { return this.raw(this.full(k), d); },
    set: function (k, v) { var fk = this.full(k); mem[fk] = v; try { localStorage.setItem(fk, JSON.stringify(v)); } catch (e) { } }
  };
  store.who = slug(store.get('learner', '') || C.studentName || '');
  function learnerName() { return String(store.get('learner', '') || C.studentName || '').trim(); }
  function setLearner(n) {
    n = String(n || '').trim().replace(/\s+/g, ' ');
    var anon = store.raw(store.full('results', ''), []), anonTarget = store.raw(store.full('target', ''), '');
    store.set('learner', n); store.who = slug(n);
    if (n && anonTarget && !store.get('target', '')) store.set('target', anonTarget);
    // bài làm trước khi nhập tên được chuyển sang tên vừa nhập
    if (n && anon.length && !store.get('results', []).length) {
      store.set('results', anon);
      try { localStorage.removeItem(store.full('results', '')); } catch (e) { }
      delete mem[store.full('results', '')];
    }
    return n;
  }
  function uid() { var u = store.get('uid', ''); if (!u) { u = Math.random().toString(36).slice(2, 8); store.set('uid', u); } return u; }

  /* ---------- kết quả làm bài ----------
     Mỗi bài làm xong, trang kỹ năng gọi V.results.add({...}) với:
       skill: 'nghe' | 'noi' | 'doc' | 'viet'
       kind:  'luyen-tap' | 'tu-vung'
       title: tên bài, ví dụ "Bài 1 – Phần 1"
       correct, total: số câu đúng / tổng số câu (nếu có)
       score10: điểm quy về thang 10 (nếu chấm được)                       */
  var results = {
    all: function () { return store.get('results', []); },
    of: function (skill) { return this.all().filter(function (r) { return r.skill === skill; }); },
    // sửa một kết quả đã lưu (tìm theo ts), ví dụ đánh dấu đã gửi: V.results.mark(rec.ts, {sent: true})
    mark: function (ts, patch) {
      var a = this.all();
      a.forEach(function (r) { if (r.ts === ts) for (var k in patch) r[k] = patch[k]; });
      store.set('results', a);
    },
    add: function (r) {
      var rec = { ts: Date.now() }; for (var k in r) rec[k] = r[k];
      var a = this.all(); a.unshift(rec); if (a.length > 300) a.length = 300;
      store.set('results', a); return rec;
    }
  };
  function round05(x) { return Math.round(x * 2) / 2; }
  function fmtScore(x) { return (Math.round(x * 10) / 10).toFixed(1); }
  // quy điểm trung bình (đã làm tròn 0,5) ra bậc VSTEP.3-5
  function bandOf(score) {
    var s = round05(score);
    if (s >= 8.5) return { key: 'c1', t: 'C1', name: 'Bậc 5' };
    if (s >= 6) return { key: 'b2', t: 'B2', name: 'Bậc 4' };
    if (s >= 4) return { key: 'b1', t: 'B1', name: 'Bậc 3' };
    return { key: 'none', t: 'Chưa đạt B1', name: '' };
  }
  // bậc mục tiêu học viên tự chọn (lưu theo tên học viên)
  var TARGETS = [
    { key: 'b1', t: 'B1', name: 'Bậc 3', min: 4, range: '4.0 – 5.5' },
    { key: 'b2', t: 'B2', name: 'Bậc 4', min: 6, range: '6.0 – 8.0' },
    { key: 'c1', t: 'C1', name: 'Bậc 5', min: 8.5, range: '8.5 – 10' }
  ];
  function target() {
    var k = store.get('target', '') || String(C.defaultTarget || 'b1').toLowerCase(), out = TARGETS[0];
    TARGETS.forEach(function (t) { if (t.key === k) out = t; });
    return out;
  }
  function setTarget(k) { store.set('target', k); }
  function dateShort(ts) { var d = new Date(ts); return d.getDate() + '/' + (d.getMonth() + 1); }

  /* ---------- liên kết giữa các trang ---------- */
  function onSites() {
    try { return /(^|\.)googleusercontent\.com$/i.test(location.hostname) || /sites\.google\.com/i.test(document.referrer || ''); } catch (e) { return false; }
  }
  function linkMode() { var m = C.linkMode || 'auto'; return m === 'auto' ? (onSites() ? 'site' : 'file') : m; }
  function linkFor(key, hash) {
    var u = '';
    if (linkMode() === 'site') {
      u = String((C.links || {})[key] || '').trim();
      if (u && !/^https?:\/\//i.test(u)) { var base = String(C.siteUrl || '').trim().replace(/\/+$/, ''); u = base ? base + '/' + u.replace(/^\/+/, '') : ''; }
      return u;                       // Google Sites không chuyển được phần #... vào trang nhúng
    }
    u = String((C.files || {})[key] || '').trim();
    return u ? u + (hash ? '#' + hash : '') : '';
  }
  // Trong Google Sites: thử chuyển trang ngay trong tab; nếu bị chặn thì sau 0,45 giây mở tab mới.
  function go(url) {
    var left = false, mark = function () { left = true; };
    window.addEventListener('beforeunload', mark); window.addEventListener('pagehide', mark);
    var framed = true;
    try { framed = window.top !== window.self; } catch (e) { framed = true; }
    try { if (framed) window.top.location.href = url; else { window.location.href = url; return; } } catch (e) { }
    setTimeout(function () {
      if (left) return;
      var w = null;
      try { w = window.open(url, '_blank'); if (w) w.opener = null; } catch (e2) { }
      if (!w) toast('Trình duyệt chặn mở trang. Hãy chọn trang ở menu phía trên của site.');
    }, 450);
  }
  // tạo một liên kết tới trang khác: V.link('nghe', {class:'btn'}, 'Luyện tập') hoặc V.link('nghe#tu-vung', ...)
  function link(target, attrs) {
    var parts = String(target).split('#'), key = parts[0], hash = parts[1] || '';
    var url = linkFor(key, hash), kids = Array.prototype.slice.call(arguments, 2), a;
    attrs = attrs || {};
    if (!url) {
      attrs.type = 'button';
      a = h('button', attrs, kids);
      a.addEventListener('click', function () { toast('Trang này chưa được gắn link. Hãy chọn trang ở menu phía trên của site.'); });
      return a;
    }
    attrs.href = url;
    if (linkMode() === 'site') { attrs.target = '_top'; attrs.rel = 'noopener'; }
    a = h('a', attrs, kids);
    if (linkMode() === 'site') a.addEventListener('click', function (e) { e.preventDefault(); go(url); });
    return a;
  }
  function pageInfo(key) { for (var i = 0; i < PAGES.length; i++) if (PAGES[i].key === key) return PAGES[i]; return PAGES[0]; }

  /* ---------- khung trang: menu, tiêu đề, chuyển trang, chân trang ---------- */
  var whoEl = null;
  function drawWho() {
    if (!whoEl) return;
    clear(whoEl); var n = learnerName();
    if (n) add(whoEl, ['Học viên: ', h('b', null, n)]);
  }
  function nav() {
    whoEl = h('span', { class: 'nav-who' });
    drawWho();
    return h('header', { class: 'nav' }, h('div', { class: 'nav-in' },
      link('home', { class: 'brand' }, C.brand || 'Ôn thi VSTEP', h('span', { class: 'lvl' }, C.level || 'B1–C1')),
      whoEl,
      h('nav', { class: 'nav-links', 'aria-label': 'Các trang' }, PAGES.map(function (p) {
        return link(p.key, { class: 'nav-a' + (p.key === PAGE ? ' on' : ''), 'aria-current': p.key === PAGE ? 'page' : null }, p.t);
      }))));
  }
  function pageHead(title, tag, sub) {
    return h('div', { class: 'pagehead' },
      h('h1', null, title, tag ? h('span', { class: 'lvl' }, tag) : null),
      sub ? h('p', null, sub) : null);
  }
  function section(title, sub) {
    var s = h('section', { class: 'sec' }, h('h2', null, title), sub ? h('p', { class: 'sub' }, sub) : null);
    for (var i = 2; i < arguments.length; i++) add(s, arguments[i]);
    return s;
  }
  function pager() {
    var i = 0; PAGES.forEach(function (p, k) { if (p.key === PAGE) i = k; });
    var prev = PAGES[i - 1], next = PAGES[i + 1];
    return h('nav', { class: 'pager', 'aria-label': 'Trang trước và trang sau' },
      prev ? link(prev.key, { class: 'prev' }, h('span', { class: 'dir' }, 'Trang trước'), h('span', { class: 'nm' }, prev.t)) : null,
      next ? link(next.key, { class: 'next' }, h('span', { class: 'dir' }, 'Trang sau'), h('span', { class: 'nm' }, next.t)) : null);
  }
  function teacher() { return String(C.teacherName || '').trim() || 'giáo viên'; }
  function cap(s) { s = String(s); return s.charAt(0).toUpperCase() + s.slice(1); }
  function mount(render) {
    var body = document.body; clear(body);
    var root = h('main', { class: 'wrap', id: 'app' });
    var navEl = nav();
    body.appendChild(navEl);
    // chiều cao thanh menu, để các thanh dính bên dưới không bị che
    var setNavH = function () { document.documentElement.style.setProperty('--navh', navEl.offsetHeight + 'px'); };
    setNavH(); window.addEventListener('resize', setNavH); window.addEventListener('load', setNavH);
    body.appendChild(root);
    render(root);
    audioCheck(root);
    root.appendChild(h('footer', { class: 'foot' },
      (C.brand || 'Ôn thi VSTEP') + ' ' + (C.level || 'B1–C1') + '. Kết quả làm bài được lưu trên máy này' + (sheetOn() ? ' và gửi về bảng điểm của ' + teacher() + '.' : '.')));
  }

  /* ---------- ô nhập tên học viên ---------- */
  function learnerBox(onChange) {
    var box = h('div', { class: 'learner' });
    function draw(edit) {
      clear(box);
      var name = learnerName();
      if (name && !edit) {
        add(box, [h('div', { class: 'lb-name' }, h('span', { class: 'muted small' }, 'Học viên'), h('b', null, name)),
          h('button', { class: 'btn small', type: 'button', onclick: function () { draw(true); } }, 'Đổi tên')]);

     "text": "Obesity has become one of the most serious health issues of our time, and it is particularly worrying that so many of those affected are children and young adults. This essay will examine the main causes of this trend and suggest some ways of dealing with it.\n\nPerhaps the most obvious cause is a change in diet. Processed food and sugary drinks are cheap, heavily advertised and available on every street corner, whereas fresh ingredients take time and money to prepare. As a result, many families rely on ready meals and takeaways that are high in calories but low in nutrients. A second factor is the increasingly inactive lifestyle that modern technology has brought about. People drive rather than walk, work at desks rather than in fields, and spend their free time in front of screens instead of playing sport.\n\nSeveral measures could be taken to tackle the problem. To begin with, governments could impose a tax on sugary products and restrict the advertising of junk food to children, as some countries have already done with encouraging results. Schools also have a key role to play by providing healthy lunches, teaching pupils how to cook simple meals and making physical education a daily activity. At the same time, cities should be designed to encourage movement, with safe cycle lanes, pavements and public sports facilities. Ultimately, however, individuals must take responsibility for their own habits, and public campaigns can help them to make better choices.\n\nIn conclusion, rising obesity is mainly the result of poor diet and a lack of exercise. Only a combination of government action, education and personal effort is likely to reverse the trend.",

     "text": "When young people finish their studies, they have to decide how to earn money. Some people want to work for a big company, while others want to start their own business. In this essay, I will discuss both ideas and give my opinion.\n\nOn the one hand, working for a large company has some clear advantages. The first advantage is a stable salary. Employees receive money every month, so they can pay for their house and food without worrying. Big companies also give their workers health insurance and paid holidays. In addition, new employees can learn a lot from their managers and older colleagues. For example, my sister works for a bank, and she has taken many free training courses there.\n\nOn the other hand, many people prefer to be their own boss. When you have your own business, you can make all the decisions and choose your working hours. If the business is successful, you can earn much more money than an employee. However, it is also risky. You need a lot of money to start, you often have to work at weekends, and you may lose everything if customers do not come.\n\nIn my opinion, working for a large company is the better choice for young people who have just graduated. They can get experience and save money first. After some years, when they understand the market well, they can open their own business.\n\nIn conclusion, both ways of working have good and bad points. I believe people should work for a company first and start a business later.",

    "b2": {
     "text": "Taking a year out between school and university is a well-established tradition in some parts of the world and is becoming more common elsewhere. Like any major decision, it has both benefits and drawbacks, which this essay will consider in turn.\n\nThe principal advantage of a gap year is the maturity it can bring. Whether they spend the time working, volunteering or travelling, young people are forced to manage their own budgets, deal with unfamiliar situations and take responsibility for their decisions. Consequently, they often arrive at university more confident and more motivated than those who come straight from school. A year of work experience can also help them to confirm, or reconsider, their choice of degree, which may prevent an expensive mistake later on.\n\nOn the other hand, a gap year carries certain risks. Students may lose the habit of studying and find it difficult to return to lectures and examinations after twelve months away. There is also the financial side: long-distance travel is costly, and those from less wealthy families may simply be unable to afford it. Furthermore, an unplanned year can easily be wasted, leaving the young person a year behind their classmates with little to show for it.\n\nOn balance, I believe the value of a gap year depends on how it is used. A well-organised year with clear goals can be a real investment in a young person's future, whereas a year spent drifting is likely to do more harm than good.\n\nIn conclusion, a gap year offers independence and direction but may interrupt study and strain family finances. Careful planning is the key to making it worthwhile.",

     "text": "Nowadays, many university students feel stressed. They often look tired and worried, and some of them even become ill. In this essay, I will explain why this happens and what we can do about it.\n\nI think there are three main reasons for this problem. The first reason is the pressure of exams. Students have to study many subjects at the same time, and they are afraid of getting low marks. The second reason is money. University fees are high, and living in a big city is expensive. Therefore, a lot of students have part-time jobs in the evening, and they do not have enough time to rest. The third reason is that many students live far from their families. They feel lonely, and they have nobody to talk to when they have problems.\n\nThere are several ways to reduce stress. First of all, students should plan their time carefully. If they study a little every day, they will not have to stay up all night before an exam. They should also do some exercise, such as jogging or playing badminton, because it helps them to relax and sleep better. In addition, universities should help their students. For example, they can offer free advice from a counsellor and give more scholarships to poor students. Finally, students should call their parents often and make new friends by joining clubs.\n\nIn conclusion, exams, money problems and living away from home are the main causes of stress among students. However, good habits and support from universities and families can make student life much easier.",

     "text": "University is often described as the best time of a person's life, yet surveys repeatedly show that a large number of students experience serious stress. This essay will look at the reasons behind this and propose some possible solutions.\n\nOne major source of stress is academic pressure. Students are expected to meet frequent deadlines, sit demanding examinations and maintain high grades in order to compete for a limited number of good jobs. Financial difficulties add to the burden. Tuition fees and rent have risen sharply, so many students take on part-time work, which leaves them with less time to study and even less time to rest. On top of this, those who have moved away from home for the first time may feel isolated and homesick, without the family support they have always relied on.\n\nFortunately, there is much that can be done. Universities should make counselling services easy to access and ensure that students know about them from their first week. Simply knowing that help is available can make a real difference. Lecturers could also coordinate deadlines so that several major assignments do not fall on the same day. As for students themselves, learning to manage their time is essential: a realistic weekly plan that includes exercise, sleep and social activities is far healthier than last-minute revision through the night. Finally, governments could ease financial pressure by expanding grants and low-interest loans.\n\nIn conclusion, student stress stems mainly from heavy workloads, money worries and loneliness. If universities, governments and students each play their part, the problem can be considerably reduced, allowing young people to enjoy their studies as well as succeed in them.",

    "text": "Some people think that keeping wild animals in zoos is cruel. Others believe that zoos play an important role in protecting animals and educating the public.",
    "q": "Discuss both views and give your own opinion.",
    "outline": [
     "Mở bài: nêu hai quan điểm, nói bài sẽ bàn cả hai.",

     "Thân bài 2, vườn thú có ích: bảo vệ loài sắp tuyệt chủng, giúp mọi người hiểu về động vật.",

    ],
    "b1": {
     "text": "Zoos are popular places for families in many cities. However, people have different ideas about them. Some people say that it is cruel to keep wild animals in zoos, while others think that zoos are useful. In this essay, I will discuss both views and give my own opinion.\n\nOn the one hand, some people believe that zoos are bad for animals. Wild animals such as lions, elephants and bears need a lot of space to run and hunt. In a zoo, they have to live in small cages, and they cannot behave in a natural way. As a result, many of them become bored, unhappy or ill. In addition, some animals come from cold countries, so the hot weather in a tropical zoo is very difficult for them.\n\nOn the other hand, other people think that zoos are important. Firstly, zoos protect animals that are in danger. In the wild, many animals are killed by hunters or lose their homes when forests are cut down. In a zoo, they are safe, and they have enough food and good doctors. Secondly, zoos teach people about animals. When children see a real tiger or giraffe, they learn more than from books or television, and they understand why we must protect nature.\n\nIn my opinion, zoos are still necessary, but they must take good care of their animals. They should give the animals large areas with trees and water, not small cages.\n\nIn conclusion, zoos have both good and bad sides. I believe that good zoos can help animals and people at the same time.",

      [
       "people have different ideas about",
       "mọi người có ý kiến khác nhau về"

      ],
      [

      [
       "other people think that",

      ],
      [
       "animals that are in danger",
       "các loài vật đang gặp nguy hiểm"
      ],
      [
       "take good care of",
       "chăm sóc tốt cho"
      ]
     ]
    },
    "b2": {
     "text": "The question of whether wild animals should be kept in zoos has been debated for decades. Critics regard zoos as little more than prisons, while supporters see them as centres of conservation and education. This essay will examine both positions before presenting my own.\n\nOpponents of zoos argue that captivity is fundamentally unnatural. Animals that would normally roam across vast territories are confined to enclosures a tiny fraction of that size, and many display signs of distress, such as pacing endlessly up and down. Moreover, they are deprived of the opportunity to hunt, migrate or choose a mate, behaviour that is essential to their well-being. From this point of view, using living creatures for human entertainment cannot be justified.\n\nSupporters, by contrast, emphasise the contribution that modern zoos make to conservation. Breeding programmes have saved several species from extinction, and some animals have even been successfully returned to the wild. Zoos also fund research and give millions of visitors, particularly children, a direct experience of wildlife that no documentary can match. This experience, it is argued, makes people more likely to support the protection of natural habitats.\n\nIn my view, both sides have a point, and the real issue is the quality of the zoo. Institutions that keep animals in cramped cages purely for profit should be closed, since they contribute nothing to conservation. However, well-run zoos with spacious, natural enclosures and serious conservation programmes deserve our support, at least until the threats facing wild habitats have been reduced.\n\nIn conclusion, although keeping animals in captivity is far from ideal, I believe responsible zoos do more good than harm and remain necessary in today's world.",

   "t2": {

    "kind": "lợi và hại",
    "text": "In many countries, it is common for several generations of a family, such as grandparents, parents and children, to live together in one house.",
    "q": "Write an essay to discuss the advantages and disadvantages of this way of living.",
    "outline": [
     "Mở bài: nêu hiện tượng, nói bài sẽ bàn lợi và hại.",

    "b1": {
     "text": "In Vietnam and many other Asian countries, grandparents, parents and children often live together in the same house. This way of living has been common for a long time. In this essay, I will discuss its advantages and disadvantages.\n\nThere are several advantages when many generations live together. First, family members can help each other. Grandparents can look after the young children when the parents are at work, and the parents can take care of the grandparents when they are old or ill. Second, it saves money. The family pays for only one house, and they share the cost of food, electricity and water. Third, children can learn a lot from their grandparents. They hear stories about the past, and they learn to respect older people. The grandparents are also happier because they do not feel lonely.\n\nHowever, this way of living also has some disadvantages. The biggest problem is that there is not much privacy. When seven or eight people live in a small house, it is noisy, and nobody has a quiet place to work or rest. Another problem is that old and young people often think differently. For example, grandparents and parents may not agree about how to bring up the children or how to spend money. These differences can cause arguments in the family.\n\nIn conclusion, living with several generations has both good and bad points. In my opinion, the advantages are greater, because family members can support each other every day. However, everyone in the house should listen to the others and respect their habits.",

      [

    "b2": {
     "text": "The extended family, in which three or even four generations share a single home, remains the norm in many parts of the world, although it is gradually giving way to smaller households. This arrangement has clear strengths as well as some undeniable weaknesses.\n\nPerhaps the greatest benefit is mutual support. Grandparents frequently take on childcare, which allows both parents to work and spares the family the cost of a nursery. In return, elderly relatives are cared for at home instead of facing loneliness or being placed in a care home. There are economic advantages too: housing costs and household bills are shared, which is particularly valuable where property prices are high. Furthermore, children who grow up surrounded by older relatives tend to develop strong family bonds and absorb traditional values naturally. The older generation benefits as well, since daily contact with grandchildren keeps them active and gives them a sense of purpose.\n\nNevertheless, living at such close quarters is not without its difficulties. Privacy is limited, and young couples in particular may feel that they have little control over their own lives. Differences in attitude between the generations, for instance over how children should be raised or how money ought to be spent, can easily lead to tension. In addition, the burden of housework and caring for elderly relatives often falls unfairly on one person, usually the wife or daughter-in-law.\n\nIn conclusion, multi-generational living provides practical help, financial savings and emotional closeness, but at the cost of privacy and occasional conflict. In my view, it works well when the house is large enough to give each generation its own space and when family members are willing to compromise.",

   "t2": {
    "vi": "rô-bốt và trí tuệ nhân tạo làm thay việc của con người: tốt hay xấu",
    "kind": "nêu quan điểm",
    "text": "In the future, more and more jobs that are done by people today will be done by robots and artificial intelligence.",
    "q": "Do you think this is a positive or a negative development?",
    "outline": [

    "b1": {
     "text": "Today, robots and computers can do many jobs that people did in the past. For example, robots build cars in factories, and machines sell tickets at stations. In the future, they will do even more jobs. In my opinion, this change has more good points than bad points.\n\nFirstly, robots can do dangerous and boring work for us. They can work in mines, in very hot factories or with dangerous chemicals, so fewer people will be hurt at work. Robots also do not get tired, so they can do the same thing all day without making mistakes.\n\nSecondly, robots and computers work very fast, so companies can make more products at a lower cost. As a result, things such as phones, clothes and food will be cheaper for everyone. People may also work fewer hours and have more free time for their families and hobbies.\n\nHowever, I understand why many people are worried. Drivers, factory workers and shop assistants may lose their jobs, and it is not easy for older workers to find new ones. This is a serious problem. To solve it, governments and companies should give workers free training so that they can learn new skills. Schools should also teach students how to use new technology and how to think in a creative way, because robots cannot do these things well.\n\nIn conclusion, I believe that robots will make our lives better, safer and more comfortable. However, we must prepare for this change carefully so that nobody is left without a job.",

       "thay đổi này có nhiều mặt tốt hơn mặt xấu"

  ];
  var LEVELS = [['Dưới B1', 3], ['B1', 5], ['B2', 7], ['C1', 9]];
  var LINKS = ['firstly', 'first', 'secondly', 'second', 'thirdly', 'finally', 'however', 'moreover', 'furthermore', 'in addition', 'besides', 'for example', 'for instance', 'such as',
    'because', 'therefore', 'as a result', 'consequently', 'although', 'while', 'whereas', 'on the other hand', 'nevertheless', 'despite', 'instead', 'also', 'in conclusion', 'to sum up', 'in my opinion', 'in my view',
    'first of all', 'to begin with', 'as well', 'so that', 'since', 'thus', 'in other words', 'admittedly', 'by contrast', 'on balance', 'that said', 'on top of this', 'as for',

  function mmss(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function count(text) { return (String(text || '').match(/\S+/g) || []).length; }

  /* ---------- máy soát nhanh: chỉ đếm và soát lỗi hình thức ---------- */
  function quick(text, tk) {
    var out = [], n = count(text), paras = text.split(/\n/).filter(function (s) { return s.trim().length > 25; }).length;
    out.push([n >= tk.min, n + ' từ' + (n >= tk.min ? ', đủ yêu cầu ít nhất ' + tk.min + ' từ.' : ', còn thiếu ' + (tk.min - n) + ' từ so với yêu cầu ' + tk.min + ' từ.')]);
    out.push([paras >= tk.paras, paras + ' đoạn. ' + (paras >= tk.paras ? 'Bài có chia đoạn.' : tk.id === 't1' ? 'Thư nên có ít nhất 3 đoạn: mở đầu, nội dung, kết thư. Xuống dòng để tách đoạn.' : 'Bài luận nên có ít nhất 4 đoạn: mở bài, hai đoạn thân bài, kết bài. Xuống dòng để tách đoạn.')]);
    if (tk.id === 't1') {
      var hi = /^\s*(dear|hi|hello)\b/i.test(text), bye = /(best wishes|all the best|regards|yours sincerely|yours faithfully|yours|love|see you|take care|cheers)\b[^\n]*(\n[^\n]*)?\s*$/i.test(text.slice(-160));
      out.push([hi, hi ? 'Có lời chào đầu thư.' : 'Chưa thấy lời chào đầu thư (Dear …, hoặc Hi …,).']);
      out.push([bye, bye ? 'Có lời chào cuối thư.' : 'Chưa thấy lời chào cuối thư (Best wishes, Yours sincerely, …).']);
    }
    var low = ' ' + text.toLowerCase().replace(/\s+/g, ' ') + ' ', found = LINKS.filter(function (w) { return new RegExp('[^a-z]' + w + '[^a-z]').test(low); }), need = tk.id === 't1' ? 2 : 5;
    out.push([found.length >= need ? true : tk.id === 't1' ? null : false, 'Từ nối đã dùng (' + found.length + '): ' + (found.length ? found.join(', ') : 'chưa có') + '.' + (found.length >= need ? '' : ' Hãy thêm từ nối như however, in addition, for example.')]);
    var bad = [];
    if (/(^|[^A-Za-z'’])i(?=[\s'’,.!?]|$)/.test(text)) bad.push('chữ “I” (tôi) phải viết hoa');
    if (/[.!?]\s+[a-z]/.test(text.replace(/(^|[^A-Za-z'’])i(?=[\s'’,.!?]|$)/g, '$1I').replace(/\b(e\.g|i\.e|etc|a\.m|p\.m)\.\s+/gi, ' ')) || /^\s*[a-z]/.test(text)) bad.push('có câu chưa viết hoa chữ đầu');
    if (/[,;!?][A-Za-z]/.test(text)) bad.push('thiếu dấu cách sau dấu câu');
    var chat = text.match(/\b(u|ur|pls|plz|thx|bc|gonna|wanna|im|dont|cant|wont)\b/gi);
    if (chat) bad.push('có từ viết tắt kiểu tin nhắn (' + chat.slice(0, 3).join(', ') + ')');
    var rep = text.match(/\b([A-Za-z]+)\s+\1\b/i);
    if (rep && !/^(that|had|very)$/i.test(rep[1])) bad.push('từ bị lặp liền nhau (“' + rep[0] + '”)');
    out.push([!bad.length, bad.length ? 'Cần sửa: ' + bad.join('; ') + '.' : 'Không thấy lỗi viết hoa, dấu cách hay viết tắt kiểu tin nhắn.']);
    if (tk.id === 't2') {
      var short = text.match(/\b[A-Za-z]+n['’]t\b|\b(I|it|they|we|you|he|she|that|there)['’](m|s|re|ve|d|ll)\b/g);
      if (short) out.push([null, 'Bài luận nên viết đầy đủ (do not, it is) thay cho dạng rút gọn: ' + short.slice(0, 3).join(', ') + '.']);
    }
    return out;
  }

  /* ================= VIẾT BÀI ================= */
  function start(test, tasks, title) {
    stopTimer(); V.clear(panel); doing(true);
    var total = 0, boxes = {}, t0 = Date.now(), armed = 0;
    tasks.forEach(function (tk) { total += tk.mins * 60; });
    var clock = h('span', { class: 'clock', role: 'timer' }), cnt = h('span', { class: 'count' }), warn = h('div');
    function tick() {
      var left = total - (Date.now() - t0) / 1000;
      clock.textContent = left > 0 ? mmss(left) : 'Hết giờ';
      if (left <= 0 && !clock.classList.contains('late')) { clock.classList.add('late'); V.toast('Đã hết ' + Math.round(total / 60) + ' phút. Bạn vẫn viết tiếp được, nhưng khi thi thật thì phải dừng bút.'); }
    }
    function upd() {
      var n = 0; tasks.forEach(function (tk) { if (boxes[tk.id]) n += count(boxes[tk.id].value); });
      V.add(V.clear(cnt), [n + ' ', h('span', { class: 'long' }, 'từ')]);
    }
    function submit() {
      var short = [], all = 0;
      tasks.forEach(function (tk) { var n = count(boxes[tk.id].value); all += n; if (n < tk.min) short.push(tk.title + ' mới có ' + n + '/' + tk.min + ' từ'); });
      if (!all) { V.toast('Bạn chưa viết gì. Hãy viết bài rồi mới nộp.'); return; }
      if (short.length && Date.now() - armed > 8000) {
        armed = Date.now();
        V.clear(warn).appendChild(h('div', { class: 'notice warn', style: { marginBottom: '14px' }, role: 'alert' }, short.join('; ') + '. Bấm Nộp bài lần nữa nếu bạn vẫn muốn nộp.'));
        return;
      }
      var texts = {}; tasks.forEach(function (tk) { texts[tk.id] = boxes[tk.id].value.trim(); });
      reviewView(test, tasks, title, texts, Math.max(1, Math.round((Date.now() - t0) / 60000)));
    }
    panel.appendChild(h('div', { class: 'dobar' },
      h('div', null, h('b', null, title), cnt, clock),
      h('div', { class: 'row' }, h('button', { class: 'btn small', type: 'button', onclick: function () { V.toast('Bài đang viết đã được lưu nháp.'); listView(); top(); } }, 'Thoát'),
        h('button', { class: 'btn primary', type: 'button', onclick: submit }, 'Nộp bài'))));
    panel.appendChild(warn);
    tasks.forEach(function (tk) {
      var t = test[tk.id], num = h('b', null, '0 từ'), state = h('span');
      var ta = h('textarea', { class: 'wbox' + (tk.id === 't2' ? ' long' : ''), lang: 'en', spellcheck: 'false', autocapitalize: 'sentences', 'aria-label': tk.title + ', ô viết bài',
        placeholder: tk.id === 't1' ? 'Dear …,' : 'Viết bài luận của bạn ở đây…' });

      var saveT = null;
      function draw() {
        var n = count(ta.value);
        num.textContent = n + ' từ';
        V.clear(state).appendChild(n >= tk.min ? h('span', { class: 'pill ok' }, 'Đủ số từ') : h('span', { class: 'need' }, 'cần ít nhất ' + tk.min + ' từ, còn thiếu ' + (tk.min - n)));
        upd();
      }
      ta.addEventListener('input', function () {
        draw(); V.clear(warn);
        clearTimeout(saveT); saveT = setTimeout(function () { V.store.set(draftKey(test, tk), ta.value); }, 400);
      });
      ta.addEventListener('blur', function () { V.store.set(draftKey(test, tk), ta.value); });
      panel.appendChild(h('h2', { class: 'parthead' }, tk.title + ': ' + tk.name, h('span', { class: 'pill blue' }, tk.level)));
      panel.appendChild(h('p', { class: 'muted', style: { margin: '-6px 0 12px', maxWidth: '74ch' } }, tk.how));
      panel.appendChild(h('article', { class: 'item' }, h('h3', null, 'Đề bài'), prompt(test, tk), ta, h('div', { class: 'wcount' }, num, state),
        hint('Gợi ý dàn ý', t.outline, tk.frame)));
      draw();
    });
    panel.appendChild(h('div', { class: 'row', style: { marginTop: '18px' } }, h('button', { class: 'btn primary', type: 'button', onclick: submit }, 'Nộp bài')));
    tick(); timerId = setInterval(tick, 1000); top();
  }

  /* ================= BÀI MẪU, MÁY SOÁT NHANH, TỰ CHẤM ================= */
  function mark(text, ph) {
    if (!ph || !ph.length) return text;
    var list = ph.map(function (x) { return x[0]; }).sort(function (a, b) { return b.length - a.length; })
      .map(function (s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); });
    var out = [];
    text.split(new RegExp('\\b(' + list.join('|') + ')\\b', 'gi')).forEach(function (s, i) { if (s) out.push(i % 2 ? h('mark', { class: 'hl' }, s) : s); });
    return out;
  }
  // texts = null: chỉ xem bài mẫu

    else {

        h('div', { class: 'big' }, String(sum), h('span', null, ' từ')),
        h('div', null, h('b', null, title), h('p', null, tasks.map(function (tk) { return tk.title + ': ' + count(texts[tk.id]) + ' từ (yêu cầu ít nhất ' + tk.min + ')'; }).join('. ') + '. Thời gian viết: ' + mins + ' phút.'))));
      panel.appendChild(h('ol', { class: 'steps', style: { marginTop: '14px' } },
        h('li', null, 'Xem máy soát nhanh số từ, số đoạn và lỗi hình thức.'),
        h('li', null, 'Đọc bài mẫu và các cụm từ được tô vàng, so với bài của bạn.'),

    }
    panel.appendChild(h('div', { class: 'row', style: { margin: '14px 0 6px' } },
      viewOnly ? h('button', { class: 'btn primary', type: 'button', onclick: edit }, 'Viết đề này') : [h('button', { class: 'btn', type: 'button', onclick: edit }, 'Sửa bài viết'), fresh],
      h('button', { class: 'btn', type: 'button', onclick: back }, 'Về danh sách đề')));

    function modelBox(tk) {
      var box = h('div', { class: 'model' }), t = test[tk.id];
      function draw() {
        var lv = level(), m = t[lv];
        V.clear(box).appendChild(h('div', { class: 'mh' },
          h('b', null, 'Bài viết mẫu (' + count(m.text) + ' từ)'),
          h('div', { class: 'seg', role: 'group', 'aria-label': 'Mức của bài mẫu' }, [['b1', 'Mức B1'], ['b2', 'Mức B2–C1']].map(function (o) {
            return h('button', { type: 'button', 'aria-pressed': lv === o[0] ? 'true' : 'false', onclick: function () { V.store.set('viet.lv', o[0]); models.forEach(function (f) { f(); }); } }, o[1]);
          }))));
        box.appendChild(h('div', { class: 'mtext', lang: 'en' }, m.text.split(/\n\s*\n/).map(function (para) { return h('p', null, mark(para, m.ph)); })));
        box.appendChild(h('ul', { class: 'phr' }, m.ph.map(function (x) { return h('li', null, h('b', { lang: 'en' }, x[0]), ' ' + x[1]); })));
      }
      models.push(draw); draw();
      return box;
    }
    tasks.forEach(function (tk) {
      var t = test[tk.id], mine = null;
      if (!viewOnly) {
        var text = texts[tk.id];
        mine = [h('span', { class: 'lab2' }, 'Bài viết của bạn'),
          text ? h('div', { class: 'mytext', lang: 'en' }, text) : h('div', { class: 'mytext none' }, 'Bạn chưa viết bài này.'),
          text ? [h('span', { class: 'lab2' }, 'Máy soát nhanh'),
            h('ul', { class: 'qc' }, quick(text, tk).map(function (r) { return h('li', { class: r[0] === null ? 'tip' : r[0] ? 'ok' : 'no' }, r[1]); })),
            h('p', { class: 'small muted', style: { marginTop: '6px' } }, 'Máy chỉ đếm và soát lỗi hình thức; nội dung, từ vựng và ngữ pháp do bạn tự chấm hoặc ' + V.teacher() + ' chấm.')] : null];
      }
      panel.appendChild(h('h2', { class: 'parthead' }, tk.title + ': ' + tk.name, h('span', { class: 'pill blue' }, tk.level)));
      panel.appendChild(h('article', { class: 'item' }, h('h3', null, 'Đề bài'), prompt(test, tk), mine, modelBox(tk), hint('Dàn ý của bài mẫu', t.outline)));
    });
    var done = viewOnly ? [] : tasks.filter(function (tk) { return texts[tk.id]; });
    if (done.length) panel.appendChild(assess());
    panel.appendChild(h('div', { class: 'row', style: { marginTop: '18px' } },
      h('button', { class: 'btn primary', type: 'button', onclick: edit }, viewOnly ? 'Viết đề này' : 'Sửa bài viết'),
      h('button', { class: 'btn', type: 'button', onclick: back }, 'Về danh sách đề')));

    /* ---------- tự chấm theo 4 tiêu chí của bài thi Viết ---------- */
    function assess() {
      var box = h('section', { class: 'assess' }), pick = {}, warn = h('div');
      var sendText = h('input', { type: 'checkbox', id: 'viet-send-text', checked: true });
      box.appendChild(h('h2', null, 'Tự chấm bài viết'));
      box.appendChild(h('p', { class: 'muted', style: { maxWidth: '72ch' } }, 'Bài thi Viết được chấm theo 4 tiêu chí. Ở mỗi tiêu chí, chọn dòng giống bài viết của bạn nhất.' + (done.length > 1 ? ' Bài 2 được tính gấp đôi Bài 1.' : '')));
      done.forEach(function (tk) {
        if (done.length > 1) box.appendChild(h('h3', null, tk.title + ': ' + tk.name));
        CRIT.forEach(function (c, ci) {
          var name = tk.id + 'c' + ci, fs = h('fieldset', { class: 'q' }, h('legend', null, (ci + 1) + '. ' + c[0]));
          c[1].forEach(function (text, li) {
            var id = name + '-' + li, r = h('input', { type: 'radio', name: name, id: id });
            r.addEventListener('change', function () { pick[name] = li; V.clear(warn); });
            fs.appendChild(h('label', { class: 'opt', for: id }, r, h('span', { class: 'lv' }, LEVELS[li][0]), h('span', null, text)));
          });
          box.appendChild(fs);
        });
      });
      if (V.sheetOn()) box.appendChild(h('label', { class: 'send', for: 'viet-send-text' }, sendText,
        h('span', null, 'Gửi kèm bài viết để ' + V.teacher() + ' đọc và chấm. Bỏ chọn nếu bạn chỉ muốn gửi điểm tự chấm.')));
      box.appendChild(warn);
      box.appendChild(h('div', { class: 'row', style: { marginTop: '16px' } }, h('button', { class: 'btn primary', type: 'button', onclick: save }, 'Lưu kết quả')));
      function save() {
        var left = done.length * CRIT.length - Object.keys(pick).length;
        if (left > 0) {
          V.clear(warn).appendChild(h('div', { class: 'notice warn', style: { marginTop: '14px' }, role: 'alert' }, 'Còn ' + left + ' tiêu chí chưa chọn.'));
          return;
        }
        var num = 0, den = 0, crit = CRIT.map(function () { return 0; }), detail = [];
        done.forEach(function (tk) {
          var s = 0;
          CRIT.forEach(function (c, ci) { var v = LEVELS[pick[tk.id + 'c' + ci]][1]; s += v; crit[ci] += v * tk.weight; });
          num += s / CRIT.length * tk.weight; den += tk.weight;
          detail.push(tk.title + ': ' + CRIT.map(function (c, ci) { return c[0] + ' ' + LEVELS[pick[tk.id + 'c' + ci]][0]; }).join(', '));
        });
        var low = 0; crit.forEach(function (v, i) { if (v < crit[low]) low = i; });
        var score10 = Math.round(num / den * 10) / 10, full = whole && done.length === TASKS.length;
        var rec = V.results.add({ skill: 'viet', kind: 'luyen-tap', title: title, score10: score10, full: full, self: true, sent: false });
        var band = V.bandOf(score10), tg = V.target(), s05 = V.round05(score10), sendBox = h('p', { class: 'small muted', role: 'status' });
        var verdict = 'Điểm Viết tự chấm: ' + V.fmtScore(s05) + '/10, ' + (band.key === 'none' ? 'chưa tới mốc B1' : 'tương đương ' + band.t) + '. ' +
          (s05 >= tg.min ? 'Theo tự chấm, bạn đã ở mốc mục tiêu ' + tg.t + '.' : 'Mốc mục tiêu ' + tg.t + ' cần từ ' + V.fmtScore(tg.min) + ' điểm.') +
          ' Tiêu chí nên luyện trước: ' + CRIT[low][0] + '. ' + CRIT[low][2];
        V.clear(box).classList.remove('assess'); box.style.marginTop = '26px';
        box.appendChild(h('div', { class: 'score' },
          h('div', { class: 'big' }, V.fmtScore(s05), h('span', null, ' /10 tự chấm')),
          h('div', null, h('b', null, title), h('p', null, verdict), sendBox)));
        box.scrollIntoView({ block: 'center' });
        var row = { 'Đề': test.title, 'Phần': whole ? 'Cả đề' : tasks[0].title, 'Số từ': done.map(function (tk) { return tk.title + ': ' + count(texts[tk.id]); }).join('; '),
          'Thời gian': mins + ' phút', 'Tự chấm /10': V.fmtScore(score10), 'Chi tiết tự chấm': detail.join('. '), 'Mục tiêu': tg.t };
        if (sendText.checked) row['Bài viết'] = done.map(function (tk) { return (done.length > 1 ? tk.title.toUpperCase() + '\n' : '') + texts[tk.id]; }).join('\n\n');
        function send() {
          if (!V.sheetOn()) { sendBox.textContent = 'Kết quả đã được lưu trên máy này. Điểm thật do giám khảo chấm; hãy chép bài viết gửi cho ' + V.teacher() + ' để được chấm và nhận xét.'; return; }
          sendBox.textContent = 'Đang gửi cho ' + V.teacher() + '…';
          V.send('viet', row, function (ok) {
            V.clear(sendBox);
            if (ok) {
              V.results.mark(rec.ts, { sent: true });
              sendBox.textContent = 'Đã lưu và gửi cho ' + V.teacher() + (row['Bài viết'] ? ' kèm bài viết.' : '.') + ' Điểm và nhận xét của ' + V.teacher() + ' sẽ hiện ở danh sách đề.';
            } else V.add(sendBox, ['Đã lưu trên máy này nhưng chưa gửi được cho ' + V.teacher() + '. ', h('button', { class: 'btn small', type: 'button', onclick: send }, 'Gửi lại')]);
          });
        }
        send();
      }
      return box;
    }
  }

  /* ================= KHUNG TRANG ================= */
  function draw() {
    V.clear(bar);
    TABS.forEach(function (t) {
      bar.appendChild(h('button', { class: 'tab' + (t[0] === tab ? ' on' : ''), type: 'button', role: 'tab', 'aria-selected': t[0] === tab ? 'true' : 'false',
        onclick: function () { tab = t[0]; try { history.replaceState(null, '', '#' + tab); } catch (e) { } draw(); } }, t[1]));
    });
    if (tab === 'tu-vung') { stopTimer(); doing(false); V.vocabTab(panel, { skill: 'viet', groups: D.vocab, source: 'nhóm cụm từ', listenFirst: false }); } else listView();
  }
  V.mount(function (root) {
    bar = h('div', { class: 'tabs', role: 'tablist' }); panel = h('div', { role: 'tabpanel' });
    window.addEventListener('hashchange', function () { tab = hashTab(); draw(); });
    root.appendChild(V.pageHead('Viết', 'Writing', 'Bài viết theo đúng định dạng VSTEP.3-5: một bức thư và một bài luận trong 60 phút. Viết có bấm giờ và đếm từ, rồi so với bài viết mẫu.'));
    root.appendChild(h('div', { style: { marginTop: '14px' } }, V.learnerBox(function () { draw(); })));
    root.appendChild(bar); root.appendChild(panel);
    draw();
    root.appendChild(V.pager());
  });
})();
</script>
</body>
