<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn thi VSTEP B1–C1 – luyện Nghe, Nói, Đọc, Viết</title>
<meta name="description" content="Luyện thi VSTEP.3-5 từ B1 đến C1 đủ 4 kỹ năng Nghe, Nói, Đọc, Viết: bài luyện có chấm điểm, từ vựng có phát âm, theo dõi kết quả.">
<script>
/* ================================================================
   CÀI ĐẶT — chỉ cần sửa phần này (giữ nguyên dấu ngoặc kép "")
   Phần này giống nhau ở cả 5 trang: sửa ở trang nào thì sửa luôn 4 trang còn lại.
   ================================================================ */
window.VSTEP_CONFIG = {
  brand: "Ôn thi VSTEP",          // tên hiện ở góc trái thanh menu
  levelName: "Bậc 3–5",           // các bậc khoá học luyện
  level: "B1–C1",
  defaultTarget: "b1",            // bậc mục tiêu khi học viên chưa tự chọn: "b1", "b2" hoặc "c1"
  studentName: "",                // tên học viên (tuỳ chọn) — để "" thì web dùng chung cho mọi người
  examDate: "",                   // ngày thi chung, dạng "2026-12-12" — để "" thì học viên tự chọn
  sheetUrl: "",                   // link Ứng dụng web Google Sheet (…/exec) của RIÊNG trang này để nhận kết quả — để "" thì kết quả chỉ lưu trên máy học viên
  teacherName: "thầy Hoàng",      // tên người chữa bài, ví dụ "cô Lan" — để "" sẽ hiện là "giáo viên"
  teacherEmail: "",               // email nhận bài Viết/Nói của học viên (để "" nếu không dùng)

  // CÁC FILE CỦA TRANG — đặt chung một thư mục, giữ nguyên tên
  linkMode: "file",
  files: { home: "index.html", nghe: "nghe.html", noi: "noi.html", doc: "doc.html", viet: "viet.html" },
  audioBase: "audio/"             // thư mục chứa file nghe và file phát âm, đặt cạnh các file .html
};
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== GIAO DIỆN DÙNG CHUNG (giống nhau ở mọi trang) ===== */
:root{
  --bg:#f4f5f9; --grid:#e6e9f0; --card:#fff; --ink:#1b2130; --muted:#5d6577; --line:#dfe3ea;
  --blue-50:#e6f0ff; --blue-100:#d6e6ff; --blue-200:#b7cff5; --blue-400:#6f9fe6; --blue-600:#2563eb; --blue-700:#1d4ed8; --blue-900:#123a7a;
  --red:#c62828; --ok:#15803d; --ok-soft:#e8f6ec; --bad:#b42318; --bad-soft:#fdecea; --warn:#8a4f06; --warn-soft:#fff5e0;
  --font:"Be Vietnam Pro","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue-700)}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--blue-600);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
.muted{color:var(--muted)}
.small{font-size:.9rem}

/* thanh menu */
.nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.nav-in{max-width:1040px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:8px 18px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.12rem;color:var(--ink);text-decoration:none;white-space:nowrap;padding:6px 0;background:none;border:0;cursor:pointer}
.brand .lvl{color:var(--red);font-weight:400;margin-left:7px}
.nav-links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.nav-links::-webkit-scrollbar{display:none}
.nav-a{white-space:nowrap;padding:8px 14px;border-radius:999px;font-weight:600;font-size:.98rem;color:var(--ink);text-decoration:none;border:1px solid transparent;background:none;cursor:pointer;line-height:1.3}
.nav-a:hover{background:var(--blue-50);border-color:var(--blue-200)}
.nav-a.on{background:var(--ink);color:#fff}
.nav-who{font-size:.9rem;color:var(--muted);white-space:nowrap;max-width:230px;min-width:0;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.nav-who b{color:var(--ink);font-weight:600}
@media(max-width:700px){
  .nav-in{padding:6px 14px}
  .nav-links{order:3;width:100%;margin-left:-6px}
  .nav-who{display:none}
  .brand{padding:4px 0}
  .nav-a{padding:7px 12px}
}

/* nút */
.btn{appearance:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;line-height:1.25;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#aeb7c7}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.btn.blue{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
.btn.blue:hover{background:var(--blue-700);border-color:var(--blue-700)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.9rem;border-radius:9px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:0 0 auto}

/* khối nội dung */
.sec{padding:34px 0 0}
.sec > h2{font-size:1.45rem;font-weight:800;letter-spacing:-.01em;line-height:1.25;margin-bottom:6px}
.sec > .sub{color:var(--muted);margin-bottom:14px;max-width:68ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.notice{border-radius:12px;padding:10px 14px;background:var(--blue-50);color:var(--blue-900);font-size:.95rem}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.ok{background:var(--ok-soft);color:#14532d}
.notice.bad{background:var(--bad-soft);color:#7f1d1d}
.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:999px;background:#eceef4;font-weight:600;font-size:.85rem;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.blue{background:var(--blue-50);color:var(--blue-900)}
.field{border:1px solid #b9c1cf;border-radius:10px;padding:9px 12px;min-height:44px;background:#fff;min-width:0}
.field:focus{outline:3px solid var(--blue-200);outline-offset:0;border-color:var(--blue-600)}

/* bảng */
.tblwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px}
.tbl{width:100%;border-collapse:collapse;font-size:.98rem}
.tbl th,.tbl td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:.88rem;color:var(--muted);font-weight:600;background:#fafbfd;white-space:nowrap}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.hl td{background:var(--blue-50)}
.tbl td.nw{white-space:nowrap}
/* màn hình hẹp: mỗi dòng của bảng thành một khối xếp dọc */
@media(max-width:700px){
  .tbl.stack thead{display:none}
  .tbl.stack,.tbl.stack tbody{display:block}
  .tbl.stack tr{display:block;padding:12px 16px;border-bottom:1px solid var(--line)}
  .tbl.stack tr:last-child{border-bottom:0}
  .tbl.stack td{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:3px 0;border:0;text-align:right;white-space:normal}
  .tbl.stack td::before{content:attr(data-label);color:var(--muted);font-size:.88rem;text-align:left;flex:0 0 auto}
  .tbl.stack td:first-child{font-size:1.05rem;padding-bottom:5px}
  .tbl.stack td:first-child::before,.tbl.stack td.long::before{content:none}
  .tbl.stack td.long{display:block;text-align:left;padding-top:6px}
}

/* tiêu đề trang con + thẻ chuyển phần */
.pagehead{padding:30px 0 6px}
.pagehead h1{font-size:clamp(2rem,5vw,2.6rem);font-weight:800;letter-spacing:-.02em;line-height:1.15}
.pagehead h1 .lvl{color:var(--red);font-weight:400;font-size:.62em;margin-left:12px;letter-spacing:0}
.pagehead p{color:var(--muted);font-size:1.05rem;margin-top:8px;max-width:64ch}
.tabs{display:flex;gap:6px;margin:18px 0 16px;border-bottom:1px solid var(--line)}
.tab{padding:10px 18px;border:1px solid transparent;border-bottom:0;border-radius:12px 12px 0 0;font-weight:700;color:var(--muted);text-decoration:none;background:none;cursor:pointer;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{background:#fff;border-color:var(--line);color:var(--ink)}
.empty{background:#fff;border:1px dashed #b9c1cf;border-radius:14px;padding:28px 22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:4px}

/* ô nhập họ tên học viên */
.learner{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.learner .lb-label{font-weight:700;width:100%}
.learner .lb-row{display:flex;gap:8px;width:100%}
.learner .lb-row .field{flex:1 1 auto}
.learner .btn{white-space:nowrap}
.learner .lb-name{display:flex;flex-direction:column;line-height:1.35}
.learner .lb-name b{font-size:1.15rem}
.learner p{width:100%}
.ipa{color:var(--blue-900);font-family:"Segoe UI","Lucida Sans Unicode","Arial Unicode MS",sans-serif}

/* nhóm nút chọn một trong vài mục */
.pick{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:.95rem;font-weight:600}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{appearance:none;border:0;border-left:1.5px solid var(--ink);background:#fff;padding:6px 16px;font-weight:700;cursor:pointer;min-height:38px;min-width:54px}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--blue-50)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button:focus-visible{outline-offset:-3px}

/* thẻ từ vựng có nút nghe phát âm */
.words{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.word{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.word .w{font-size:1.3rem;font-weight:800;letter-spacing:-.01em;line-height:1.25}
.word .pos{font-size:.82rem;color:var(--muted);font-weight:400;margin-left:6px}
.word .ipa{color:var(--blue-900);font-family:"Segoe UI","Lucida Sans Unicode","Arial Unicode MS",sans-serif;font-size:.98rem}
.word .vi{font-weight:600;margin-top:4px}
.word .ex{color:var(--muted);font-size:.92rem;line-height:1.5;margin-top:2px}
.word .say{margin-top:auto;padding-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.word .say .btn{white-space:nowrap;padding:6px 10px}
.btn.playing{background:var(--blue-50);border-color:var(--blue-400)}

/* chuyển trang trước / sau */
.pager{display:flex;justify-content:space-between;gap:12px;margin:36px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.pager a,.pager button{display:flex;flex-direction:column;gap:0;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:140px;cursor:pointer;text-align:left}
.pager a:hover,.pager button:hover{border-color:var(--blue-400);background:var(--blue-50)}
.pager .dir{font-size:.82rem;color:var(--muted)}
.pager .nm{font-weight:700}
.pager .next{text-align:right;margin-left:auto}

.foot{margin-top:44px;padding:18px 0 34px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:92vw;font-size:.95rem}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
@media print{.nav,.pager,.btn{display:none!important}body{background:#fff}}
.audiowarn{margin-top:16px;padding:14px 18px}
.audiowarn ul{margin:6px 0 6px;padding-left:20px}
.audiowarn li{margin-top:4px}
/* ===== TRANG CHỦ ===== */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;padding:38px 0 0;align-items:center}
.hero > *{min-width:0}
@media(min-width:860px){.hero{grid-template-columns:minmax(0,1.25fr) minmax(300px,.75fr)}}
.hero h1{font-size:clamp(2.15rem,6vw,3.3rem);font-weight:800;letter-spacing:-.025em;line-height:1.08}
.hero h1 .lvl{color:var(--red);font-weight:400;letter-spacing:-.02em;margin-left:.26em;white-space:nowrap}
.hero .lead{color:var(--muted);font-size:1.1rem;margin-top:14px;max-width:54ch}
/* thước điểm 0–10 */
.scale{margin-top:22px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px 18px}
.scale h2{font-size:1.15rem;font-weight:800}
.scale-head{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.ruler{position:relative;padding-top:46px;margin-top:6px}
.ruler.nopin{padding-top:12px}
.ruler-track{position:relative;display:flex;height:64px;border:1.5px solid var(--ink);border-radius:10px;background:#fff}
.zone{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;line-height:1.25;border-left:1.5px solid var(--ink);min-width:0;padding:0 2px}
.zone:first-child{border-left:0;border-radius:8px 0 0 8px;background:repeating-linear-gradient(135deg,#f1f3f7 0 8px,#fff 8px 16px)}
.zone:last-of-type{border-radius:0 8px 8px 0}
.zone b{font-size:1.05rem;font-weight:800}
.zone span{font-size:.8rem;color:var(--muted);white-space:nowrap}
.zone.goal{background:var(--blue-50)}
.zone.goal b{color:var(--blue-900)}
.zone.goal span{color:var(--blue-900)}
.ruler-ticks{position:relative;height:30px;margin:0 1px;background-image:linear-gradient(90deg,var(--ink) 1.5px,transparent 1.5px);background-size:5% 7px;background-repeat:repeat-x;background-position:0 0}
.ruler-ticks::after{content:"";position:absolute;right:0;top:0;width:1.5px;height:7px;background:var(--ink)}
.ruler-ticks i{position:absolute;top:9px;transform:translateX(-50%);font-style:normal;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ruler-ticks i:first-child{transform:none}
.ruler-ticks i:last-child{transform:translateX(-100%)}
.pin{position:absolute;left:0;top:-46px;height:46px;width:0;border-left:3px solid var(--red);transform:translateX(-1.5px);z-index:2}
.pin::after{content:"";position:absolute;left:-8.5px;bottom:-1px;border:7px solid transparent;border-top-color:var(--red);border-bottom:0}
.pin::before{content:"";position:absolute;left:-3px;top:112px;width:3px;height:11px;background:var(--red)}
.pin span{position:absolute;top:0;left:-3px;background:var(--red);color:#fff;font-weight:700;font-size:.92rem;line-height:1;padding:7px 10px;border-radius:0 8px 8px 0;white-space:nowrap}
.pin.flip span{left:auto;right:0;border-radius:8px 0 0 8px}
.scale .say{margin-top:12px;max-width:74ch}
.scale .say b{font-weight:700}
.scale-foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:.95rem}
.scale-foot label{font-weight:600}
.scale-foot .field{min-height:38px;padding:5px 10px}
@media(max-width:520px){.scale{padding:16px 14px}.zone b{font-size:.95rem}.zone span{font-size:.7rem}}

/* 4 ô kỹ năng */
.tiles{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:600px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1000px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;background:var(--blue-50);border:1.5px solid var(--blue-200);border-radius:16px;padding:18px 16px 16px;box-shadow:0 3px 0 var(--blue-200)}
.tile .top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.tile .ic{width:46px;height:46px;border-radius:12px;background:#fff;color:var(--blue-700);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tile .ic svg{width:26px;height:26px}
.tile h3{font-size:1.35rem;font-weight:800;color:var(--blue-900);line-height:1.15}
.tile .en{font-size:.88rem;color:#46597a}
.tile .fmt{color:#33456a;font-size:.93rem;line-height:1.5}
.tile .st{font-size:.88rem;color:#46597a;margin:8px 0 14px}
.tile .st b{color:var(--blue-900)}
.tile .acts{margin-top:auto;display:grid;gap:8px}
.tile .btn{width:100%}
.tile .btn:not(.blue){border-color:var(--blue-200)}
.tile .btn:not(.blue):hover{border-color:var(--blue-400)}

/* kết quả */
.sk{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.sk svg{width:18px;height:18px;color:var(--blue-700)}
.log{list-style:none;margin:0;padding:0;background:#fff;border:1px solid var(--line);border-radius:14px}
.log li{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:11px 16px;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log .when{color:var(--muted);font-size:.88rem;min-width:44px;font-variant-numeric:tabular-nums}
.log .what{flex:1 1 220px}
.log .res{font-weight:700;font-variant-numeric:tabular-nums}
.log .cm{width:100%;color:var(--muted);font-size:.93rem}
.two{display:grid;gap:22px}
@media(min-width:860px){.two{grid-template-columns:1fr 1fr}}
.two h3{font-size:1.05rem;font-weight:700;margin-bottom:8px}
.how{margin:14px 0 0;padding-left:20px;color:var(--muted);font-size:.95rem;max-width:74ch}

/* lộ trình */
.plan{display:grid;gap:14px}
@media(min-width:700px){.plan{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1000px){.plan{grid-template-columns:repeat(4,minmax(0,1fr))}}
.week{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.week h3{font-size:1.05rem;font-weight:800;margin-bottom:6px}
.week .cnt{float:right;font-size:.85rem;color:var(--muted);font-weight:400}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer;font-size:.96rem;line-height:1.45}
.chk input{width:19px;height:19px;margin-top:3px;flex:0 0 auto;accent-color:var(--blue-600)}
.chk input:checked + span{color:var(--muted);text-decoration:line-through}
.tips{margin:0;padding:6px 20px 6px 38px;background:#fff;border:1px solid var(--line);border-radius:14px}
.tips li{padding:7px 0}
</style>
</head>
<body>
<noscript><p style="padding:20px">Trang này cần bật JavaScript để hoạt động.</p></noscript>
<script>window.VSTEP_PAGE = "home";</script>

    { key: 'noi', t: 'Nói', en: 'Speaking' },
    { key: 'doc', t: 'Đọc', en: 'Reading' },
    { key: 'viet', t: 'Viết', en: 'Writing' }
  ];

  function scaleCard() {
    var have = [], miss = [];
    SKILLS.forEach(function (s) { var v = skillScore(s.key); if (v === null) miss.push(s.t); else have.push([s.t, v]); });
    var est = have.length ? mean(have.map(function (x) { return x[1]; })) : null;
    var tg = V.target(), say = h('p', { class: 'say' });
    if (est === null) {
      V.add(say, 'Chưa có bài làm nào. Làm một bài luyện tập, điểm của bạn sẽ được đánh dấu trên thước này. Mục tiêu bạn chọn là ' + tg.t + ' (' + tg.name + '): trung bình 4 kỹ năng từ ' + V.fmtScore(tg.min) + ' trở lên.');
    } else {
      var r = V.round05(est), band = V.bandOf(est);
      V.add(say, [h('b', null, 'Ước lượng hiện tại: ' + V.fmtScore(r) + '/10, ' + (band.key === 'none' ? 'chưa tới mốc B1' : 'tương đương ' + band.t + ' (' + band.name + ')') + '. '),
        'Tính từ ' + have.map(function (x) { return x[0] + ' ' + V.fmtScore(x[1]); }).join(', ') + '. ',
        miss.length ? 'Chưa có điểm: ' + miss.join(', ') + '. ' : '',
        r < tg.min ? 'Cần thêm ' + V.fmtScore(tg.min - r) + ' điểm để chạm mốc ' + tg.t + '. ' : 'Bạn đang đạt mốc mục tiêu ' + tg.t + '. ',
        'Đây là điểm ước lượng từ bài luyện, không phải điểm thi.']);
    }
    var seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Bậc mục tiêu' }, V.TARGETS.map(function (t) {
      return h('button', { type: 'button', 'aria-pressed': t.key === tg.key ? 'true' : 'false', title: t.name + ', điểm trung bình ' + t.range,
        onclick: function () { V.setTarget(t.key); redraw(); } }, t.t);
    }));
    return h('div', { class: 'scale' },
      h('div', { class: 'scale-head' }, h('h2', null, 'Bạn đang ở đâu trên thang điểm VSTEP'), h('div', { class: 'pick' }, 'Mục tiêu của bạn', seg)),
      ruler(est === null ? null : V.round05(est)), say, examDate());
  }
  function examDate() {
    var fixed = String(C.examDate || '').trim(), val = fixed || V.store.get('examDate', '');
    var out = h('span', { class: 'muted' });
    function show(v) {
      var d = v ? new Date(v + 'T00:00:00') : null;
      if (!d || isNaN(d)) { out.textContent = 'Chọn ngày thi để đếm ngược.'; return; }
      var t = new Date(); t.setHours(0, 0, 0, 0);
      var n = Math.round((d - t) / 86400000);
      out.textContent = n > 0 ? 'Còn ' + n + ' ngày.' : n === 0 ? 'Hôm nay là ngày thi. Chúc bạn làm bài tốt.' : 'Ngày thi đã qua ' + (-n) + ' ngày.';
    }
    var inp = h('input', { class: 'field', type: 'date', id: 'exam-date', value: val, disabled: !!fixed });
    inp.addEventListener('change', function () { V.store.set('examDate', inp.value); show(inp.value); });
    show(val);
    return h('div', { class: 'scale-foot' }, h('label', { for: 'exam-date' }, 'Ngày thi của bạn'), inp, out);
  }

  /* ---------- 4 ô kỹ năng ---------- */
  function tiles() {
    return h('div', { class: 'tiles' }, SKILLS.map(function (s) {
      var p = practice(s.key), last = p[0], st = h('p', { class: 'st' });
      if (last) V.add(st, ['Đã làm ' + p.length + ' bài. Gần nhất: ', h('b', null, resText(last)), ' (' + V.dateShort(last.ts) + ').']);
      else V.add(st, 'Chưa làm bài nào.');
      return h('article', { class: 'tile' },
        h('div', { class: 'top' }, h('span', { class: 'ic', html: V.ICON[s.key] }), h('div', null, h('h3', null, s.t), h('div', { class: 'en', lang: 'en' }, s.en))),
        h('p', { class: 'fmt' }, s.fmt), st,
        h('div', { class: 'acts' },
          V.link(s.key + '#luyen-tap', { class: 'btn blue', 'aria-label': 'Luyện tập ' + s.t }, 'Luyện tập'),
          V.link(s.key + '#tu-vung', { class: 'btn', 'aria-label': 'Từ vựng mới phần ' + s.t }, 'Từ vựng mới')));
    }));
  }

  /* ---------- kết quả ---------- */
  function resultsBlock() {
    var rows = SKILLS.map(function (s) {
      var p = practice(s.key), scored = p.filter(function (r) { return typeof r.score10 === 'number'; });
      var best = scored.length ? Math.max.apply(null, scored.map(function (r) { return r.score10; })) : null;
      var tch = graded(s.key), est = skillScore(s.key);
      var T = V.cap(V.teacher()) + ' chấm';
      return h('tr', null,
        h('td', null, h('span', { class: 'sk' }, icon(s.key), s.t)),
        h('td', { class: 'num', 'data-label': 'Bài đã làm' }, String(p.length)),
        h('td', { class: 'num', 'data-label': 'Gần nhất' }, p[0] ? resText(p[0]) + ' (' + V.dateShort(p[0].ts) + ')' : 'Chưa có'),
        h('td', { class: 'num', 'data-label': 'Cao nhất' }, best !== null ? V.fmtScore(best) : 'Chưa có'),
        h('td', { class: 'num', 'data-label': T }, tch.length ? V.fmtScore(num(tch[0].diem)) : 'Chưa có'),
        h('td', { class: 'num', 'data-label': 'Ước lượng / 10' }, est !== null ? h('b', null, V.fmtScore(est)) : 'Chưa có'));
    });
    var table = h('div', { class: 'tblwrap' }, h('table', { class: 'tbl stack' },
      h('thead', null, h('tr', null, h('th', null, 'Kỹ năng'), h('th', { class: 'num' }, 'Bài đã làm'), h('th', { class: 'num' }, 'Gần nhất'), h('th', { class: 'num' }, 'Cao nhất'), h('th', { class: 'num' }, V.cap(V.teacher()) + ' chấm'), h('th', { class: 'num' }, 'Ước lượng / 10'))),
      h('tbody', null, rows)));

    var all = V.results.all().slice(0, 6), recent;
    if (all.length) recent = h('ul', { class: 'log' }, all.map(function (r) {
      return h('li', null, h('span', { class: 'when' }, V.dateShort(r.ts)),
        h('span', { class: 'what' }, skillName(r.skill) + (r.kind === 'tu-vung' ? ', từ vựng' : '') + (r.title ? ': ' + r.title : '')),
        h('span', { class: 'res' }, resText(r)),
        r.sent ? h('span', { class: 'pill ok' }, 'Đã gửi') : null);
    }));
    else recent = h('div', { class: 'empty' }, h('b', null, 'Chưa có bài làm'), 'Chọn một kỹ năng ở trên và làm bài đầu tiên. Kết quả sẽ hiện ở đây.');

    var fb;
    if (!V.sheetOn()) fb = h('div', { class: 'empty' }, h('b', null, 'Chưa bật gửi kết quả'), 'Trang này chưa được nối với bảng điểm của giáo viên.');
    else if (!V.learnerName()) fb = h('div', { class: 'empty' }, h('b', null, 'Nhập họ tên trước'), 'Nhập họ tên ở đầu trang để xem điểm và nhận xét của ' + V.teacher() + '.');
    else if (remoteState === 'loading' && !remote.length) fb = h('div', { class: 'empty' }, 'Đang tải điểm và nhận xét…');
    else if (remote.length) fb = h('ul', { class: 'log' }, remote.slice(0, 6).map(function (it) {
      return h('li', null, h('span', { class: 'when' }, String(it.time || '').slice(0, 5)),
        h('span', { class: 'what' }, [it.skill, it.de, it.part].filter(Boolean).join(', ')),
        h('span', { class: 'res' }, it.diem !== '' ? it.diem + ' điểm' : ''),
        it.nhanxet ? h('span', { class: 'cm' }, it.nhanxet) : null);
    }));
    else fb = h('div', { class: 'empty' }, h('b', null, remoteState === 'error' ? 'Chưa tải được' : 'Chưa có bài nào được chấm'),
      remoteState === 'error' ? 'Kiểm tra kết nối mạng rồi bấm Tải lại.' : 'Sau khi bạn nộp bài Nói hoặc Viết, điểm và nhận xét của ' + V.teacher() + ' sẽ hiện ở đây.');
    var reload = (V.sheetOn() && V.learnerName()) ? h('button', { class: 'btn small', type: 'button', style: { marginTop: '10px' }, disabled: remoteState === 'loading', onclick: function () { loadRemote(); } }, remoteState === 'loading' ? 'Đang tải…' : 'Tải lại') : null;

    return [table,
      h('div', { class: 'two', style: { marginTop: '22px' } },
        h('div', null, h('h3', null, 'Bài làm gần đây'), recent),
        h('div', null, h('h3', null, 'Điểm và nhận xét của ' + V.teacher()), fb, reload)),
      h('ul', { class: 'how' },
        h('li', null, 'Nghe và Đọc: máy chấm ngay khi bạn nộp bài' + (V.sheetOn() ? ', kết quả tự gửi cho ' + V.teacher() + '.' : '.')),
        h('li', null, 'Nói và Viết: bấm Nộp bài, ' + V.teacher() + ' chấm rồi điểm sẽ hiện ở cột "' + V.cap(V.teacher()) + ' chấm".'),
        h('li', null, 'Kết quả lưu theo họ tên trên máy này. Đổi máy hoặc xoá dữ liệu trình duyệt thì phần lưu trên máy sẽ mất, phần đã gửi vẫn còn ở bảng điểm.'))];
  }

  /* ---------- từ vựng hôm nay ---------- */
  function todayWords() {
    var list = WORDS[V.target().key] || WORDS.b1;
    var day = Math.floor(Date.now() / 86400000), n = list.length, out = [];
    for (var i = 0; i < 4; i++) out.push(list[(day * 4 + i) % n]);
    return h('div', { class: 'words' }, out.map(V.wordCard));
  }

  /* ---------- lộ trình ---------- */
  function planBlock() {
    var done = V.store.get('plan', {}), tk = V.target().key;
    return h('div', { class: 'plan' }, (PLAN[tk] || PLAN.b1).map(function (w, wi) {
      var cnt = h('span', { class: 'cnt' });
      var upd = function () { var c = 0; w[1].forEach(function (_, ii) { if (done[tk + '-' + wi + '-' + ii]) c++; }); cnt.textContent = c + '/' + w[1].length; };
      upd();
      return h('div', { class: 'week' }, h('h3', null, w[0], cnt), w[1].map(function (it, ii) {
        var k = tk + '-' + wi + '-' + ii, cb = h('input', { type: 'checkbox' }); cb.checked = !!done[k];
        cb.addEventListener('change', function () { done[k] = cb.checked; V.store.set('plan', done); upd(); });
        return h('label', { class: 'chk' }, cb, h('span', null, it));
      }));
    }));
  }

  /* ---------- mỗi bậc cần đạt gì ---------- */
  function goalsBlock() {
    var tk = V.target().key;
    return h('div', { class: 'tblwrap' }, h('table', { class: 'tbl stack' },
      h('thead', null, h('tr', null, h('th', null, 'Bậc'), h('th', null, 'Điểm trung bình'), h('th', null, 'Nghe đúng'), h('th', null, 'Đọc đúng'), h('th', null, 'Nói và Viết'))),
      h('tbody', null, GOALS.map(function (g) {
        var t = V.TARGETS.filter(function (x) { return x.key === g[0]; })[0];
        return h('tr', { class: g[0] === tk ? 'hl' : null },
          h('td', null, h('b', null, t.t + ' (' + t.name + ')'), g[0] === tk ? h('span', { class: 'pill blue', style: { marginLeft: '8px' } }, 'Mục tiêu của bạn') : null),
          h('td', { class: 'nw', 'data-label': 'Điểm trung bình' }, g[1]), h('td', { class: 'nw', 'data-label': 'Nghe đúng' }, g[2]), h('td', { class: 'nw', 'data-label': 'Đọc đúng' }, g[3]),
          h('td', { class: 'long' }, g[4]));
      }))));
  }

  /* ---------- dựng trang ---------- */
  var live = { scale: null, tiles: null, results: null, words: null, goals: null, plan: null, planSub: null };
  function redraw() {
    V.clear(live.scale).appendChild(scaleCard());
    V.clear(live.tiles).appendChild(tiles());
    V.add(V.clear(live.results), resultsBlock());
    V.clear(live.words).appendChild(todayWords());
    V.clear(live.goals).appendChild(goalsBlock());
    V.clear(live.plan).appendChild(planBlock());
    live.planSub.textContent = 'Lộ trình cho mục tiêu ' + V.target().t + '. Đổi mục tiêu ở thước điểm phía trên thì lộ trình đổi theo. Đánh dấu khi học xong, phần đánh dấu được lưu trên máy này.';
  }
  function loadRemote() {
    if (!V.sheetOn() || !V.learnerName()) { remote = []; remoteState = ''; redraw(); return; }
    remoteState = 'loading'; redraw();
    V.feedback(function (err, items) {
      remoteState = err ? 'error' : '';
      if (!err) { remote = items; V.store.set('remote', remote); }
      redraw();
    });
  }

  V.mount(function (root) {
    live.scale = h('div'); live.tiles = h('div'); live.results = h('div'); live.words = h('div'); live.goals = h('div'); live.plan = h('div');
    root.appendChild(h('div', { class: 'hero' },
      h('div', null,
        h('h1', null, 'Ôn thi VSTEP', h('span', { class: 'lvl' }, C.level || 'B1–C1')),
        h('p', { class: 'lead' }, 'Luyện Nghe, Nói, Đọc, Viết theo đúng định dạng đề thi VSTEP.3-5, từ bậc 3 (B1) đến bậc 5 (C1). Bài làm xong được chấm, lưu lại' + (V.sheetOn() ? ' và gửi cho ' + V.teacher() + ' theo dõi.' : '.'))),
      V.learnerBox(function () { remote = V.store.get('remote', []); loadRemote(); })));
    root.appendChild(live.scale);
    root.appendChild(V.section('Chọn kỹ năng để luyện', 'Mỗi kỹ năng có hai phần: Luyện tập để làm bài và Từ vựng mới để học từ, có nút nghe phát âm.', live.tiles));
    root.appendChild(V.section('Kết quả của bạn', null, live.results));
    root.appendChild(V.section('Từ vựng hôm nay', 'Bốn từ hay gặp trong đề thi ở bậc mục tiêu của bạn, mỗi ngày đổi một lần. Nghe giọng nữ, giọng nam rồi đọc theo.', h('div', { style: { marginBottom: '12px' } }, V.speedToggle()), live.words));
    root.appendChild(V.section('Bài thi VSTEP gồm những gì', 'Bài thi VSTEP.3-5 dùng chung một đề cho ba bậc B1, B2, C1. Điểm trung bình 4 kỹ năng, làm tròn đến 0,5, quyết định bạn đạt bậc nào.',
      h('div', { class: 'tblwrap' }, h('table', { class: 'tbl stack' },
        h('thead', null, h('tr', null, h('th', null, 'Kỹ năng'), h('th', null, 'Thời gian'), h('th', null, 'Số câu'), h('th', null, 'Gồm những gì'))),
        h('tbody', null, FORMAT.map(function (f) {
          return h('tr', null, h('td', null, h('span', { class: 'sk' }, icon(f[0]), skillName(f[0]))), h('td', { class: 'nw', 'data-label': 'Thời gian' }, f[1]), h('td', { class: 'nw', 'data-label': 'Số câu' }, f[2]), h('td', { class: 'long' }, f[3]));
        })))),
      h('h3', { style: { fontSize: '1.1rem', fontWeight: '800', margin: '22px 0 8px' } }, 'Mỗi bậc cần đạt gì'),
      live.goals,
      h('p', { class: 'small muted', style: { marginTop: '10px', maxWidth: '74ch' } }, 'Số câu Nghe và Đọc là ước chừng, tính theo tỉ lệ câu đúng. Điểm một kỹ năng thấp có thể được kỹ năng khác kéo lên vì bậc xét theo điểm trung bình.')));
    var planSec = V.section('Lộ trình 4 tuần', ' ', live.plan); live.planSub = planSec.querySelector('.sub');
    root.appendChild(planSec);
    root.appendChild(V.section('Trước ngày thi', null,
      h('ul', { class: 'tips' },
        h('li', null, 'Mang căn cước hoặc hộ chiếu còn hạn và giấy báo dự thi. Đến sớm 30–45 phút.'),
        h('li', null, 'Tối trước ngày thi không học kiến thức mới. Đọc lại khung Viết và Nói 15 phút rồi ngủ sớm.'),
        h('li', null, 'Nghe và Đọc: không bỏ trống câu nào. Câu nào bí thì chọn một đáp án rồi đi tiếp.'),
        h('li', null, 'Viết: đếm đủ số từ. Thư có lời chào, lời kết và tên; bài luận đủ 4 đoạn.'),
        h('li', null, 'Nói: nói chậm và rõ. Bí ý thì nói "Well, let me think…" rồi dùng khung mẫu.'))));
    redraw();
    if (V.sheetOn() && V.learnerName()) loadRemote();
  });
})();
</script>
</body>
</html>
